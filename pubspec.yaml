name: eat
description: "沙软今天吃什么（EatWhat）客户端"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

# 本地插件和 App 共用一次依赖解析和一份 pubspec.lock.
workspace:
  - packages/eat_baidu_map
  - packages/eat_number_auth

dependencies:
  android_id: ^0.6.0
  app_links: ^7.2.2
  cached_network_image: ^4.0.5
  clock: ^1.1.3
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  eat_baidu_map:
    path: packages/eat_baidu_map
  eat_number_auth:
    path: packages/eat_number_auth
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_web_auth_2: 6.0.0-alpha.9
  flutter_web_plugins:
    sdk: flutter
  geolocator: ^14.1.2
  go_router: ^18.1.1
  image_picker: ^1.2.4
  json_annotation: ^4.12.0
  liquid_glass_widgets: ^1.16.1
  material_ui: ^1.8.0
  package_info_plus: ^10.2.2
  riverpod_annotation: ^4.0.7
  sentry_dio: ^10.1.0
  sentry_flutter: ^10.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  shorebird_code_push: ^2.0.7
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  vector_graphics: ^1.2.4
  web: ^1.1.1
  webview_flutter: ^4.14.1

dev_dependencies:
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9
  sentry_dart_plugin: ^3.4.0
  vector_graphics_compiler: ^1.3.2

flutter:
  uses-material-design: true

  # 图标在构建时预编译为二进制, 运行时由 AssetBytesLoader 读取. 由 tool/icons.dart 从 MingCute 官方包生成.
  assets:
    - path: assets/icons/
      transformers:
        - package: vector_graphics_compiler
    - assets/LICENSE-MingCute.txt
    - path: assets/illustrations/
      transformers:
        - package: vector_graphics_compiler
    - assets/emoji/thinking.webp
    - assets/emoji/thinking_still.webp
    - assets/emoji/eyes.webp
    - assets/emoji/eyes_still.webp
    - assets/emoji/LICENSE-Twemoji.txt
    - assets/fonts/OFL-Inter.txt
    - shorebird.yaml

  # 可变字体, 单个文件覆盖全部字重. 由 tool/subset_fonts.py 子集化生成.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VF.ttf
