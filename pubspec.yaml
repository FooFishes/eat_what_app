name: eat
description: "沙软今天吃什么（EatWhat）客户端"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  material_ui: ^1.8.0
  riverpod_annotation: ^4.0.7
  vector_graphics: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  vector_graphics_compiler: ^1.3.2
flutter:
  uses-material-design: true

  # 图标在构建时预编译成二进制，运行时用 AssetBytesLoader 读；14、16、18 是小尺寸的加粗描边变体
  assets:
    - path: assets/icons/
      transformers:
        - package: vector_graphics_compiler
    - path: assets/icons/14/
      transformers:
        - package: vector_graphics_compiler
    - path: assets/icons/16/
      transformers:
        - package: vector_graphics_compiler
    - path: assets/icons/18/
      transformers:
        - package: vector_graphics_compiler
    - assets/fonts/OFL-NotoSansSC.txt
    - assets/fonts/OFL-BricolageGrotesque.txt

  # 可变字体，一个文件覆盖全部字重；由 tool/subset_fonts.py 子集化生成
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-VF.ttf
