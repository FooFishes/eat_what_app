name: eat_number_auth
description: 沙软今天吃什么的运营商一键登录原生桥 (阿里云号码认证 SDK), 只给 App 的 core/platform/number_auth 使用.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  pigeon: ^29.1.1

flutter:
  plugin:
    platforms:
      android:
        package: you.v50to.eat.number_auth
        pluginClass: EatNumberAuthPlugin
      ios:
        pluginClass: EatNumberAuthPlugin
