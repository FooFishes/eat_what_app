name: Claude review

# 用 Claude 审查指向 main 的 PR, 意见作为行内评论写在 PR 上. 规则从仓库根的 CLAUDE.md (引入 AGENTS.md) 读.
# 草稿、已关闭、改动很小或已经有 Claude 评论的 PR, 插件自己会跳过.
# 来自 fork 的 PR 拿不到 Secret, 直接跳过.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # 没配令牌时跳过审查, 不让 PR 挂红.
      - id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 行内评论的 MCP 服务只在 --allowedTools 写了它时才启动, 这一行不能删.
      - if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment"
