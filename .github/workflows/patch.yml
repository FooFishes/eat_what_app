name: Patch

# 给已发布的 Android 和 iOS 版本推 Shorebird 补丁. 补丁只修 Dart 代码的问题.
# 新功能, 新权限, 新的数据收集, 原生代码和插件的改动都发新版本.
# 只有用 shorebird release 打出来的版本能打补丁 (见 build.yml); iOS 在改用 shorebird release 之前发的版本打不了.
#
# 补丁都发到 stable 轨道 (客户端只检查这一个), 分灰度和全量两种, 用 Shorebird 的按比例放量 (--rollout):
# 服务端按安装 ID 的哈希选设备, 不在比例内的设备拿这个轨道上最新的已到 100% 的补丁.
# 比例只能调高不能调低, 有问题的补丁在 Shorebird 控制台回滚.
#
# 两种触发方式:
# - 推送补丁 tag, 写作 v<版本名>+<构建号>-p<N>, 如 v1.2.3+62-p1. 全量直接推送, 不试跑, 两个平台都打.
#   发版 tag 里没有构建号, 构建号看发版构建的运行摘要或 R2 路径 (release/1.2.3-62).
#   tag 里写不下放量比例, 所以按 tag 发的都是全量.
# - 手动触发, 选择与该版本对应的 tag 运行, 默认只试跑, 可以只打一个平台. 灰度走这里, 比例默认 10.
#
# 灰度补丁之后提高比例 (如 10 -> 50 -> 100) 用 patch-rollout.yml, 或在本地运行
#   shorebird patches rollout --release-version 1.2.3+62 --patch-number <N> --percentage 50
# 补丁号写在推送那次运行的摘要里. 两个平台各打一个补丁, 补丁号不同, 要分别提高.
on:
  push:
    tags: ["v*-p[0-9]*"]
  workflow_dispatch:
    inputs:
      release-version:
        description: 要打补丁的版本, 写作 版本名+构建号, 如 0.1.0+42
        required: true
      platform:
        description: 给哪个平台打
        type: choice
        options: [both, android, ios]
        default: both
      rollout:
        description: 放量比例, 1 到 100 的整数. 默认 10 先灰度, 100 为全量
        type: number
        default: 10
      dry-run:
        description: 只构建和校验, 不上传. 第一次给某个版本打补丁时先试一遍
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.target.outputs.release-version }}
      rollout: ${{ steps.target.outputs.rollout }}
      dry-run: ${{ steps.target.outputs.dry-run }}
      label: ${{ steps.target.outputs.label }}
      android: ${{ steps.target.outputs.android }}
      ios: ${{ steps.target.outputs.ios }}
    steps:
      - id: target
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.release-version }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_ROLLOUT: ${{ inputs.rollout }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            pattern='^v([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)-p([0-9]+)$'
            if ! [[ "$REF_NAME" =~ $pattern ]]; then
              echo "::error::补丁 tag 应写作 v<版本名>+<构建号>-p<N>, 如 v1.2.3+62-p1, -p<N> 前不带后缀 (已没有 beta 轨道). 当前为 $REF_NAME"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            rollout=100
            dry=false
            label="p${BASH_REMATCH[2]}"
            platform=both
          else
            version="$INPUT_VERSION"
            rollout="$INPUT_ROLLOUT"
            if ! [[ "$rollout" =~ ^[0-9]+$ ]] || [ "$rollout" -lt 1 ] || [ "$rollout" -gt 100 ]; then
              echo "::error::放量比例应为 1 到 100 的整数. 当前为 $rollout"
              exit 1
            fi
            dry="$INPUT_DRY_RUN"
            label="run${{ github.run_number }}"
            platform="$INPUT_PLATFORM"
          fi
          android=false
          ios=false
          if [ "$platform" != ios ]; then android=true; fi
          if [ "$platform" != android ]; then ios=true; fi
          {
            echo "release-version=$version"
            echo "rollout=$rollout"
            echo "dry-run=$dry"
            echo "label=$label"
            echo "android=$android"
            echo "ios=$ios"
          } >> "$GITHUB_OUTPUT"
          echo "目标 $version, 平台 $platform, 放量 $rollout%, 试跑 $dry" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android patch
    needs: resolve
    if: needs.resolve.outputs.android == 'true'
    runs-on: ubuntu-latest
    environment: Cloudflare R2
    env:
      APP_CONFIG: ${{ secrets.APP_CONFIG }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_URL: ${{ vars.SENTRY_URL }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.release-version }}
      ROLLOUT: ${{ needs.resolve.outputs.rollout }}
      DRY_RUN: ${{ needs.resolve.outputs.dry-run }}
      R2_LABEL: ${{ needs.resolve.outputs.label }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 不支持新版 AWS CLI 默认附带的校验和.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # 补丁沿用发版时的 Flutter 版本. 环境配置和混淆选项与发版构建保持一致.
      # 版本名和构建号也和发版一致. 不传时用 pubspec.yaml 里的占位 +1, iOS 的可执行文件会和发版不同,
      # Shorebird 当成原生改动, 拒绝打补丁.
      # Shorebird 按发版的混淆映射给补丁命名, 但不存补丁自己的映射, 补丁新增的名字只在补丁构建时才有,
      # 所以另存一份给 Sentry. 试跑也存, 推送前就能确认生成得了.
      - name: Patch
        run: |
          # 输出经 tee 存下来找补丁号, 要 pipefail 才能在 shorebird 失败时失败.
          set -o pipefail
          defines=""
          if [ -n "$APP_CONFIG" ]; then
            printf '%s' "$APP_CONFIG" > config/ci.json
            defines="--dart-define-from-file=config/ci.json"
          fi
          dry=""
          if [ "$DRY_RUN" = true ]; then dry="--dry-run"; fi
          mkdir -p build/app
          shorebird patch android $dry \
            --release-version="$RELEASE_VERSION" \
            --track=stable --rollout="$ROLLOUT" \
            --obfuscate --split-debug-info=build/symbols \
            -- --build-name="${RELEASE_VERSION%+*}" --build-number="${RELEASE_VERSION#*+}" \
            $defines --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json \
            2>&1 | tee "$RUNNER_TEMP/patch.log"
          if number=$(grep -o 'Published Patch [0-9]*' "$RUNNER_TEMP/patch.log" | grep -o '[0-9]*$'); then
            echo "Android 补丁号 $number, 放量 $ROLLOUT%" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ! -s build/app/obfuscation.map.json ]; then
            echo "::error::补丁没有生成混淆映射 build/app/obfuscation.map.json"
            exit 1
          fi

      # 补丁本身由 Shorebird 分发. R2 上留一份构建出的 AAB, 符号表和混淆映射, 用于对照和还原堆栈,
      # 放在 patch/ 下, 由 R2 的生命周期规则保留 32 天. 试跑不上传.
      - name: Upload to R2
        if: env.DRY_RUN != 'true' && env.R2_BUCKET != ''
        run: |
          set -euo pipefail
          prefix="patch/${RELEASE_VERSION/+/-}/$R2_LABEL"
          out=upload
          mkdir -p "$out"
          cp build/app/outputs/bundle/release/app-release.aab "$out/eat-patch.aab"
          tar -czf "$out/symbols.tar.gz" -C build symbols
          cp build/app/obfuscation.map.json "$out/obfuscation.map.json"
          aws s3 cp "$out" "s3://$R2_BUCKET/$prefix/" --recursive \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors
          echo "R2: $prefix/" >> "$GITHUB_STEP_SUMMARY"

      # 补丁的 libapp.so 是完整的新快照, debug id 和发版不同, 每个补丁都要传自己的符号表和映射.
      # 事件的 release 是发版的 eat@版本名+构建号, 补丁号只在 dist 里, 所以传到同一个 release 下. 试跑不上传.
      # Shorebird 自带的 Flutter 不在 PATH 上, 另装 .fvmrc 的版本来跑 sentry_dart_plugin.
      - name: Read Flutter version
        id: fvm
        if: env.DRY_RUN != 'true' && env.SENTRY_AUTH_TOKEN != ''
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: env.DRY_RUN != 'true' && env.SENTRY_AUTH_TOKEN != ''
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - name: Upload symbols to Sentry
        if: env.DRY_RUN != 'true' && env.SENTRY_AUTH_TOKEN != ''
        run: |
          flutter pub get
          tool/sentry_symbols.sh "eat@$RELEASE_VERSION" build/symbols build/app/obfuscation.map.json

  ios:
    name: iOS patch
    needs: resolve
    if: needs.resolve.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      APP_CONFIG: ${{ secrets.APP_CONFIG }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.release-version }}
      ROLLOUT: ${{ needs.resolve.outputs.rollout }}
      DRY_RUN: ${{ needs.resolve.outputs.dry-run }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_URL: ${{ vars.SENTRY_URL }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # 去掉 geolocator 里的 requestAlwaysAuthorization 调用, 否则 App Store 判成缺少「始终定位」用途说明 (ITMS-90683).
      # 和发版构建 (build.yml 的 iOS) 一致, 原生部分不一样时 Shorebird 会拒绝打补丁.
      BYPASS_PERMISSION_LOCATION_ALWAYS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # 百度地图 iOS SDK 不入库, 和发版构建一样下载并转成 xcframework.
      - uses: actions/cache@v4
        with:
          path: packages/eat_baidu_map/ios/eat_baidu_map/Frameworks
          key: baidu-ios-sdk-${{ hashFiles('tool/baidu_ios_sdk.sh') }}
      - run: tool/baidu_ios_sdk.sh

      - name: Prepare signing
        if: env.IOS_DIST_CERT_P12_BASE64 != ''
        run: |
          tool/ios_signing.sh setup
          echo "SIGNED=true" >> "$GITHUB_ENV"

      # 混淆选项, 版本名和构建号和发版构建保持一致 (见安卓补丁的说明). 没有证书时不签名, 补丁照样能打.
      # 补丁的符号表写在 build/symbols/app.ios-arm64.symbols, 试跑也检查, 推送前就能确认生成得了.
      - name: Patch
        run: |
          # 输出经 tee 存下来找补丁号, 要 pipefail 才能在 shorebird 失败时失败.
          set -o pipefail
          defines=""
          if [ -n "$APP_CONFIG" ]; then
            printf '%s' "$APP_CONFIG" > config/ci.json
            defines="--dart-define-from-file=config/ci.json"
          fi
          dry=""
          if [ "$DRY_RUN" = true ]; then dry="--dry-run"; fi
          sign="--no-codesign"
          if [ "$SIGNED" = true ]; then sign="--export-options-plist=build/ios/ExportOptions.plist"; fi
          shorebird patch ios $dry $sign \
            --release-version="$RELEASE_VERSION" \
            --track=stable --rollout="$ROLLOUT" \
            --obfuscate --split-debug-info=build/symbols \
            -- --build-name="${RELEASE_VERSION%+*}" --build-number="${RELEASE_VERSION#*+}" $defines \
            2>&1 | tee "$RUNNER_TEMP/patch.log"
          if number=$(grep -o 'Published Patch [0-9]*' "$RUNNER_TEMP/patch.log" | grep -o '[0-9]*$'); then
            echo "iOS 补丁号 $number, 放量 $ROLLOUT%" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ! -s build/symbols/app.ios-arm64.symbols ]; then
            echo "::error::补丁没有生成符号表 build/symbols/app.ios-arm64.symbols"
            exit 1
          fi

      - name: Clean up signing
        if: always()
        run: tool/ios_signing.sh cleanup

      # 补丁改动的代码在 Shorebird 的解释器里跑, 这部分堆栈还原不了; 没改的部分靠发版的 dSYM 和映射.
      # 补丁没有自己的 dSYM, 链接时也存不出混淆映射, 只上传补丁自己的符号表. release 的写法和安卓补丁一样. 试跑不上传.
      - name: Read Flutter version
        id: fvm
        if: env.DRY_RUN != 'true' && env.SENTRY_AUTH_TOKEN != ''
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: env.DRY_RUN != 'true' && env.SENTRY_AUTH_TOKEN != ''
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - name: Upload symbols to Sentry
        if: env.DRY_RUN != 'true' && env.SENTRY_AUTH_TOKEN != ''
        run: |
          flutter pub get
          tool/sentry_symbols.sh "eat@$RELEASE_VERSION" build/symbols
