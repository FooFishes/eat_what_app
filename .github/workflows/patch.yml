name: Patch

# 给已发布的 Android 版本推 Shorebird 补丁. 手动触发, 选择与该版本对应的 tag 运行.
# 补丁只修 Dart 代码的问题. 新功能, 新权限, 新的数据收集, 原生代码和插件的改动都发新版本.
on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 要打补丁的版本, 写作 版本名+构建号, 如 0.1.0+42
        required: true
      track:
        description: 发布到的轨道. 客户端目前只检查 stable
        type: choice
        options: [stable, beta]
        default: stable
      dry-run:
        description: 只构建和校验, 不上传. 第一次给某个版本打补丁时先试一遍
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  android:
    name: Android patch
    runs-on: ubuntu-latest
    env:
      APP_CONFIG: ${{ secrets.APP_CONFIG }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # 补丁沿用发版时的 Flutter 版本. 环境配置和混淆选项与发版构建保持一致.
      - name: Patch
        run: |
          defines=""
          if [ -n "$APP_CONFIG" ]; then
            printf '%s' "$APP_CONFIG" > config/ci.json
            defines="--dart-define-from-file=config/ci.json"
          fi
          dry=""
          if [ "${{ inputs.dry-run }}" = true ]; then dry="--dry-run"; fi
          shorebird patch android $dry \
            --release-version="${{ inputs.release-version }}" \
            --track="${{ inputs.track }}" \
            --obfuscate --split-debug-info=build/symbols \
            -- $defines
