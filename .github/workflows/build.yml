name: Build

# 发版 tag 写作 v<版本名>+<构建号>, 可以带一个后缀, 如 v1.2.3+62, v1.2.3+62-beta. 推送这样的 tag,
# 或在这样的 tag 上手动运行, 构建 Release, 版本名和构建号取自 tag. 补丁 tag (以 -p<N> 结尾) 交给 patch.yml.
# 其余分支的 push 和手动运行构建 Nightly. PR 只构建, 不上传.
on:
  push:
    branches: ["**"]
    tags: ["v*", "!v*-p[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 用到的 Secrets 和 Variables 都可以缺省, 缺了就跳过对应步骤:
# - APP_CONFIG: config/*.json 的内容. 缺省时不传环境配置, 产物调不了接口.
# - ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD:
#   上传密钥. 缺省时 release 回落到 debug 签名.
# - SENTRY_AUTH_TOKEN 和 Variables 中的 SENTRY_URL, SENTRY_ORG, SENTRY_PROJECT: 发版时上传符号表和 source map.
# - SHOREBIRD_TOKEN: 发版时 Android 改用 shorebird release. 还需要仓库里有 shorebird.yaml.
# - 环境 Cloudflare R2 的 R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET: 产物上传到 R2. 缺省时不上传.
env:
  APP_CONFIG: ${{ secrets.APP_CONFIG }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_URL: ${{ vars.SENTRY_URL }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

jobs:
  check:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    outputs:
      flutter-version: ${{ steps.fvm.outputs.flutter }}
      release: ${{ steps.version.outputs.release }}
      build-name: ${{ steps.version.outputs.build-name }}
      build-number: ${{ steps.version.outputs.build-number }}
      r2-prefix: ${{ steps.version.outputs.r2-prefix }}
    steps:
      - uses: actions/checkout@v7

      # Flutter 版本只在 .fvmrc 中维护, 后续 job 复用此处的输出.
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      # 发版 tag 决定版本名和构建号, Shorebird 补丁按它们找到对应的版本. 其余构建用 pubspec.yaml 的版本名和运行号.
      # 以 v 开头但格式不对的 tag 直接失败, 免得当成 Nightly 构建出去.
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          pattern='^v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)(-([A-Za-z0-9.]+))?$'
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == v* ]]; then
            if [[ "$REF_NAME" =~ -p[0-9]+$ ]] || ! [[ "$REF_NAME" =~ $pattern ]]; then
              echo "::error::发版 tag 应写作 v<版本名>+<构建号>[-后缀], 如 v1.2.3+62-beta. 当前为 $REF_NAME"
              exit 1
            fi
            name="${BASH_REMATCH[1]}"
            number="${BASH_REMATCH[2]}"
            {
              echo "release=true"
              echo "build-name=$name"
              echo "build-number=$number"
              echo "r2-prefix=release/${REF_NAME#v}" | tr '+' '-'
            } >> "$GITHUB_OUTPUT"
          else
            name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
            {
              echo "release=false"
              echo "build-name=$name"
              echo "build-number=${{ github.run_number }}"
              echo "r2-prefix=nightly/$name-${{ github.run_number }}-${GITHUB_SHA::7}"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get
      # 生成文件入库. 源文件修改后未重新生成, 或生成后未提交, 此步失败.
      - run: dart run build_runner build --only-check
      # 原生桥的 Pigeon 生成文件也入库. 接口定义改了没重新生成, 此步失败.
      - name: Check Pigeon output
        working-directory: packages/eat_baidu_map
        run: |
          dart run pigeon --input pigeons/messages.dart
          dart format lib/src/messages.g.dart
          git diff --exit-code .
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # riverpod_lint 等分析器插件的结果只由 dart analyze 报告.
      - run: dart analyze --fatal-infos
      - run: flutter test

  android:
    name: Android
    needs: check
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ needs.check.outputs.release }}
      BUILD_NAME: ${{ needs.check.outputs.build-name }}
      BUILD_NUMBER: ${{ needs.check.outputs.build-number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Prepare build arguments
        run: |
          # DEFINES 交给 flutter build. RELEASE_FLAGS 是 flutter build 和 shorebird release 都认的选项,
          # shorebird release 要求写在 -- 之前.
          defines=""
          if [ -n "$APP_CONFIG" ]; then
            printf '%s' "$APP_CONFIG" > config/ci.json
            defines="--dart-define-from-file=config/ci.json"
          fi
          flags="--build-name=$BUILD_NAME --build-number=$BUILD_NUMBER"
          # 发版构建混淆 Dart 代码, 符号表留给 Sentry 还原堆栈.
          if [ "$IS_RELEASE" = true ]; then
            flags="$flags --obfuscate --split-debug-info=build/symbols"
          fi
          echo "DEFINES=$defines" >> "$GITHUB_ENV"
          echo "RELEASE_FLAGS=$flags" >> "$GITHUB_ENV"
          if [ "$IS_RELEASE" = true ] && [ -n "$SHOREBIRD_TOKEN" ] && [ -f shorebird.yaml ]; then
            echo "USE_SHOREBIRD=true" >> "$GITHUB_ENV"
          fi

      # 没有上传密钥时 build.gradle.kts 回落到 debug 签名, 产物只能用于测试.
      - name: Restore upload key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build with Flutter
        if: env.USE_SHOREBIRD != 'true'
        run: |
          # 混淆映射让 Sentry 还原错误标题中的类名.
          map=""
          if [ "$IS_RELEASE" = true ]; then
            map="--extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json"
          fi
          flutter build apk --release $RELEASE_FLAGS $DEFINES $map
          flutter build appbundle --release $RELEASE_FLAGS $DEFINES $map

      # 用 Shorebird 的引擎构建, 之后才能对这个版本推补丁. Flutter 版本必须和 .fvmrc 一致.
      - uses: shorebirdtech/setup-shorebird@v1
        if: env.USE_SHOREBIRD == 'true'
        with:
          cache: true
      - name: Build with Shorebird
        if: env.USE_SHOREBIRD == 'true'
        # --artifact=apk 在 aab 之外再出一个 apk, 供安装测试.
        run: |
          shorebird release android --artifact=apk \
            --flutter-version=${{ needs.check.outputs.flutter-version }} \
            $RELEASE_FLAGS -- $DEFINES

      - name: Upload symbols to Sentry
        if: env.IS_RELEASE == 'true' && env.SENTRY_AUTH_TOKEN != ''
        run: |
          dart run sentry_dart_plugin \
            --sentry-define=url="$SENTRY_URL" \
            --sentry-define=org="$SENTRY_ORG" \
            --sentry-define=project="$SENTRY_PROJECT" \
            --sentry-define=release="eat@$BUILD_NAME+$BUILD_NUMBER" \
            --sentry-define=upload_debug_symbols=true \
            --sentry-define=upload_source_maps=false \
            --sentry-define=symbols_path=build/symbols \
            --sentry-define=dart_symbol_map_path=build/app/obfuscation.map.json \
            --sentry-define=ignore_missing=true

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

  ios:
    name: iOS
    needs: check
    runs-on: macos-latest
    env:
      IS_RELEASE: ${{ needs.check.outputs.release }}
      BUILD_NAME: ${{ needs.check.outputs.build-name }}
      BUILD_NUMBER: ${{ needs.check.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
          channel: stable
          cache: true

      - run: flutter pub get

      # 百度地图 iOS SDK 不入库, 从百度 CDN 下载并转成 xcframework. 脚本里写着版本和校验值, 按脚本内容缓存.
      - uses: actions/cache@v4
        with:
          path: packages/eat_baidu_map/ios/eat_baidu_map/Frameworks
          key: baidu-ios-sdk-${{ hashFiles('tool/baidu_ios_sdk.sh') }}
      - run: tool/baidu_ios_sdk.sh

      - name: Prepare build arguments
        run: |
          args="--build-name=$BUILD_NAME --build-number=$BUILD_NUMBER"
          if [ -n "$APP_CONFIG" ]; then
            printf '%s' "$APP_CONFIG" > config/ci.json
            args="$args --dart-define-from-file=config/ci.json"
          fi
          echo "BUILD_ARGS=$args" >> "$GITHUB_ENV"

      # TODO: 未签名构建, 只验证能否编译, 不混淆, 也不上传符号表. 有 Apple 开发者账号后加签名, TestFlight 上传和 shorebird release ios.
      - run: flutter build ios --release --no-codesign $BUILD_ARGS

      - name: Package Runner.app
        run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/Runner.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned
          path: build/ios/Runner.app.zip
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web
    needs: check
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ needs.check.outputs.release }}
      BUILD_NAME: ${{ needs.check.outputs.build-name }}
      BUILD_NUMBER: ${{ needs.check.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
          channel: stable
          cache: true

      - run: flutter pub get

      # CanvasKit 从自己的域名加载, 默认的 www.gstatic.com 在大陆访问不到.
      # 构建号写进 version.json, 启动时读出, 作为崩溃上报的 release.
      - name: Build
        run: |
          args="--build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --no-web-resources-cdn"
          if [ -n "$APP_CONFIG" ]; then
            printf '%s' "$APP_CONFIG" > config/ci.json
            args="$args --dart-define-from-file=config/ci.json"
          fi
          if [ "$IS_RELEASE" = true ]; then
            args="$args --source-maps"
          fi
          flutter build web --release $args

      - name: Upload source maps to Sentry
        if: env.IS_RELEASE == 'true' && env.SENTRY_AUTH_TOKEN != ''
        run: |
          dart run sentry_dart_plugin \
            --sentry-define=url="$SENTRY_URL" \
            --sentry-define=org="$SENTRY_ORG" \
            --sentry-define=project="$SENTRY_PROJECT" \
            --sentry-define=release="eat@$BUILD_NAME+$BUILD_NUMBER" \
            --sentry-define=upload_debug_symbols=false \
            --sentry-define=upload_source_maps=true \
            --sentry-define=web_build_path=build/web

      # source map 只给 Sentry, 不随产物部署.
      - run: find build/web -name '*.map' -delete

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web
          if-no-files-found: error
          retention-days: 1

  # GitHub 上的产物只保留 1 天, 用来在 job 之间传递. 要分发和留存的产物上传到 R2,
  # 按目录区分保留期: release/ 和 patch/ 32 天, nightly/ 2 天, 由 R2 的生命周期规则删除.
  # PR 构建不上传.
  publish:
    name: Upload to R2
    needs: [check, android, ios, web]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && (needs.android.result == 'success'
      || needs.ios.result == 'success' || needs.web.result == 'success') }}
    runs-on: ubuntu-latest
    environment: Cloudflare R2
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 不支持新版 AWS CLI 默认附带的校验和.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      PUBLIC_URL: https://release.foofish.work
      BUILD_NAME: ${{ needs.check.outputs.build-name }}
      R2_PREFIX: ${{ needs.check.outputs.r2-prefix }}
    steps:
      # 只下载构建成功的产物, 每个产物放在以名字命名的目录里.
      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Upload
        if: env.R2_BUCKET != ''
        run: |
          set -euo pipefail
          out=upload
          mkdir -p "$out"
          if [ -d dist/android ]; then
            cp dist/android/flutter-apk/app-release.apk "$out/eat-$BUILD_NAME.apk"
            cp dist/android/bundle/release/app-release.aab "$out/eat-$BUILD_NAME.aab"
          fi
          if [ -d dist/ios-unsigned ]; then
            cp dist/ios-unsigned/Runner.app.zip "$out/eat-$BUILD_NAME-ios-unsigned.zip"
          fi
          if [ -d dist/web ]; then
            (cd dist/web && zip -qr "../../$out/eat-$BUILD_NAME-web.zip" .)
          fi
          aws s3 cp "$out" "s3://$R2_BUCKET/$R2_PREFIX/" --recursive \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors
          {
            echo "### R2"
            for f in "$out"/*; do
              echo "- $PUBLIC_URL/$R2_PREFIX/$(basename "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
