name: Build

# 触发条件: main 的 push 与 PR, 以 v 开头的 tag, 手动触发.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    outputs:
      flutter-version: ${{ steps.fvm.outputs.flutter }}
    steps:
      - uses: actions/checkout@v7

      # Flutter 版本只在 .fvmrc 中维护, 后续 job 复用此处的输出.
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get
      # 生成文件入库. 源文件修改后未重新生成, 或生成后未提交, 此步失败.
      - run: dart run build_runner build --only-check
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # riverpod_lint 等分析器插件的结果只由 dart analyze 报告.
      - run: dart analyze --fatal-infos
      - run: flutter test

  android:
    name: Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
          channel: stable
          cache: true

      - run: flutter pub get

      # TODO: release 使用 debug 签名, 产物只能用于测试. 接入上传密钥后改用正式签名.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
          channel: stable
          cache: true

      - run: flutter pub get

      # 未签名构建, 只验证能否编译. 签名和上传 TestFlight 另行配置.
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Package Runner.app
        run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/Runner.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned
          path: build/ios/Runner.app.zip
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web
          if-no-files-found: error
          retention-days: 14
