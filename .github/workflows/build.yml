name: Build

# 发版 tag 写作 v<版本名>, 可以带一个后缀, 如 v1.2.3, v1.2.3-beta. 版本名必须和 pubspec.yaml 一致.
# 推送这样的 tag, 或在这样的 tag 上手动运行, 构建 Release. 补丁 tag (以 -p<N> 结尾) 交给 patch.yml.
# main 的 push 和不在发版 tag 上的手动运行构建 Nightly. 其他分支不自动构建, 要构建就在 Actions 页手动选分支运行.
# PR (目标为 main) 只构建, 不上传.
# main 的 push 和 PR 如果没有改动进产物的文件 (只改了文档, 测试, 画板等, 见 check 的 changes), 只做检查, 不构建.
# 发版 tag 和手动运行总是构建.
#
# 版本名只在 pubspec.yaml 里维护. 构建号由 tool/build_number.sh 从 App Store Connect 查出:
# 这个 App 用过的最大构建号加 1, 所有平台共用. pubspec.yaml 里的 +1 只是本地构建的占位.
# main 和发版 tag 的 iOS 构建签名后上传 TestFlight.
on:
  push:
    branches: [main]
    tags: ["v*", "!v*-p[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# main 和发版 tag 共用一个组, 一次只跑一个, 不取消正在跑的: 从查构建号到上传 TestFlight 之间
# 不能有第二次构建插进来, 否则两次会拿到同一个号. 排队中的旧 main 构建会被新的替换, 这没关系;
# 发版 tag 的构建如果在排队时被替换 (显示为取消), 重新运行即可.
# 其余分支和 PR 按 ref 分组, 新的推送取消旧的.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && 'store' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

permissions:
  contents: read
  # check 查 main 上一次成功的运行, 见 changes.
  actions: read

# 用到的 Secrets 和 Variables 都可以缺省, 缺了就跳过对应步骤:
# - APP_CONFIG: config/*.json 的内容. 缺省时不传环境配置, 产物调不了接口.
# - ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD:
#   上传密钥. 缺省时 release 回落到 debug 签名.
# - SENTRY_AUTH_TOKEN 和 Variables 中的 SENTRY_URL, SENTRY_ORG, SENTRY_PROJECT: 发版时上传符号表和 source map.
# - SHOREBIRD_TOKEN: 发版时 Android 和 iOS 改用 shorebird release. 还需要仓库里有 shorebird.yaml; iOS 另外要有签名证书.
# - 环境 Cloudflare R2 的 R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET: 产物上传到 R2. 缺省时不上传.
# - ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 和 Variables 中的 ASC_APP_ID: App Store Connect API 密钥 (App Manager 权限即可)
#   和 App 的 Apple ID. 用来查构建号和上传 TestFlight. 缺省时构建号用 pubspec.yaml 里的占位, 不上传.
# - IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, IOS_PROFILE_BASE64: 发布证书 (.p12) 和 App Store 描述文件,
#   都是 base64. 缺省时 iOS 只做未签名构建.
env:
  APP_CONFIG: ${{ secrets.APP_CONFIG }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_URL: ${{ vars.SENTRY_URL }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
  ASC_APP_ID: ${{ vars.ASC_APP_ID }}
  # 构建号下限. 改用 App Store Connect 之前, 安卓包用 CI 运行号 (到过 50 左右) 做 versionCode, 新号要比它们大.
  BUILD_NUMBER_MIN: 100

jobs:
  check:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    outputs:
      flutter-version: ${{ steps.fvm.outputs.flutter }}
      release: ${{ steps.version.outputs.release }}
      build-name: ${{ steps.version.outputs.build-name }}
      build-number: ${{ steps.version.outputs.build-number }}
      r2-prefix: ${{ steps.version.outputs.r2-prefix }}
      testflight: ${{ steps.version.outputs.testflight }}
      build: ${{ steps.changes.outputs.build }}
    steps:
      # PR 检出的是合并提交, 多取一层才有它的第一个父提交 (合并时的 main), changes 拿它比较.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # 判断这次要不要构建. 改动的文件都不进产物时 build=false, 后面的构建 job 跳过, 只做检查.
      # PR 和合并时的 main 比较. main 的 push 不和 event.before 比较: 排队中的 main 构建会被新的替换,
      # 只和上一次推送比, 被替换掉的那次改了代码, 后面一次只改文档时代码就没人构建了.
      # 所以和 main 上一次成功的运行比较, 成功的运行要么构建过, 要么它之前的改动都不用构建; 失败和取消的不算, 它们的改动会再构建一次.
      # 发版 tag 和手动运行总是构建. 查不到基准, 取不到提交等任何意外都按要构建处理, 这一步不让 job 失败.
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # 只看文件路径. 文档, 测试, 画板, 落地页, 编辑器配置, 分析器配置和 build.yml 以外的 CI 文件不进产物.
          # build.yml 自己改了要构建, 验证改动.
          needs_build() {
            local f
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                .github/workflows/build.yml) return 0 ;;
                docs/* | prototype/* | landing/* | test/* | .vscode/* | .claude/* | .github/*) ;;
                *.md | analysis_options.yaml | web_dev_config.yaml | .gitignore | */.gitignore) ;;
                *) return 0 ;;
              esac
            done
            return 1
          }

          base=""
          case "$EVENT" in
            pull_request)
              base=$(git rev-parse --verify --quiet HEAD^1) || base=""
              ;;
            push)
              if [ "$REF" = refs/heads/main ]; then
                # PR 的运行也可能挂在名为 main 的分支上 (来自 fork), 排除掉.
                base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&status=success&per_page=20" \
                  --jq '[.workflow_runs[] | select(.event != "pull_request")][0].head_sha // empty') || base=""
                if [ -n "$base" ] && ! git fetch --no-tags --depth=1 origin "$base"; then
                  base=""
                fi
              fi
              ;;
          esac
          if [[ "$base" =~ ^0+$ ]]; then
            base=""
          fi

          build=true
          if [ -n "$base" ] && files=$(git diff --name-only --no-renames "$base" HEAD); then
            echo "基准 $base, 改动的文件:"
            echo "${files:-(无)}"
            if ! needs_build <<< "$files"; then
              build=false
            fi
          else
            echo "事件 $EVENT, 没有可比较的基准, 照常构建."
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [ "$build" = false ]; then
            echo "没有改动进产物的文件, 只做检查, 不构建." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Flutter 版本只在 .fvmrc 中维护, 后续 job 复用此处的输出.
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      # 版本名取自 pubspec.yaml, 发版 tag 里的版本名必须和它一致. 以 v 开头但格式不对的 tag 直接失败,
      # 免得当成 Nightly 构建出去. 构建号见文件开头.
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          STORE_REF: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
        run: |
          name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          release=false
          suffix=""
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == v* ]]; then
            pattern='^v([0-9]+\.[0-9]+\.[0-9]+)(-([A-Za-z0-9.]+))?$'
            if [[ "$REF_NAME" =~ -p[0-9]+$ ]] || ! [[ "$REF_NAME" =~ $pattern ]]; then
              echo "::error::发版 tag 应写作 v<版本名>[-后缀], 如 v1.2.3, v1.2.3-beta. 当前为 $REF_NAME"
              exit 1
            fi
            if [ "${BASH_REMATCH[1]}" != "$name" ]; then
              echo "::error::tag 的版本名 ${BASH_REMATCH[1]} 和 pubspec.yaml 的 $name 不一致"
              exit 1
            fi
            release=true
            suffix="${BASH_REMATCH[3]}"
          fi
          # 有 App Store Connect 密钥时查号, 查询失败整个构建失败, 不猜号.
          # 没有密钥 (如来自 fork 的 PR) 时用 pubspec.yaml 里的占位, 这样的构建不会上传.
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_APP_ID" ]; then
            number=$(tool/build_number.sh)
            testflight=$STORE_REF
          else
            number=$(sed -n 's/^version: *[^+]*+\([0-9]*\).*/\1/p' pubspec.yaml)
            testflight=false
          fi
          if [ "$release" = true ]; then
            prefix="release/$name-$number${suffix:+-$suffix}"
          else
            prefix="nightly/$name-$number-${GITHUB_SHA::7}"
          fi
          {
            echo "release=$release"
            echo "build-name=$name"
            echo "build-number=$number"
            echo "r2-prefix=$prefix"
            echo "testflight=$testflight"
          } >> "$GITHUB_OUTPUT"
          echo "版本 $name ($number)" >> "$GITHUB_STEP_SUMMARY"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get
      # 资源转换器给每个 SVG 单独起一个 dart run vector_graphics_compiler, flutter test 最多 64 个并发, flutter build 是核数的一半.
      # 编译器的快照不存在时, 这些进程会同时从源码重编编译器, 每个 2–3 GB. 先串行编一个图标, 把快照生成好.
      - name: Warm up vector_graphics_compiler
        run: dart run vector_graphics_compiler --input=assets/icons/add.svg --output="$RUNNER_TEMP/warmup.vec"
      # 生成文件入库. 源文件修改后未重新生成, 或生成后未提交, 此步失败.
      - run: dart run build_runner build --only-check
      # 原生桥的 Pigeon 生成文件也入库. 接口定义改了没重新生成, 此步失败.
      - name: Check Pigeon output
        run: |
          for plugin in eat_baidu_map eat_number_auth; do
            (
              cd "packages/$plugin"
              dart run pigeon --input pigeons/messages.dart
              dart format lib/src/messages.g.dart
              git diff --exit-code .
            )
          done
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # riverpod_lint 等分析器插件的结果只由 dart analyze 报告.
      - run: dart analyze --fatal-infos
      - run: flutter test

  android:
    name: Android
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ needs.check.outputs.release }}
      BUILD_NAME: ${{ needs.check.outputs.build-name }}
      BUILD_NUMBER: ${{ needs.check.outputs.build-number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
          channel: stable
          cache: true

      - run: flutter pub get
      # 先生成 vector_graphics_compiler 的快照, 原因见 check.
      - name: Warm up vector_graphics_compiler
        run: dart run vector_graphics_compiler --input=assets/icons/add.svg --output="$RUNNER_TEMP/warmup.vec"

      - name: Prepare build arguments
        run: |
          # DEFINES 交给 flutter build. RELEASE_FLAGS 是 flutter build 和 shorebird release 都认的选项,
          # shorebird release 要求写在 -- 之前.
          defines=""
          if [ -n "$APP_CONFIG" ]; then
            printf '%s' "$APP_CONFIG" > config/ci.json
            defines="--dart-define-from-file=config/ci.json"
          fi
          # 只打 arm64-v8a 和 armeabi-v7a, AAB 也一样. x86_64 只有模拟器用, 去掉能省下约三分之一的包体.
          # Shorebird 打补丁时会跳过发版里没有的架构.
          flags="--build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --target-platform=android-arm,android-arm64"
          # 发版构建混淆 Dart 代码, 符号表留给 Sentry 还原堆栈.
          if [ "$IS_RELEASE" = true ]; then
            flags="$flags --obfuscate --split-debug-info=build/symbols"
          fi
          echo "DEFINES=$defines" >> "$GITHUB_ENV"
          echo "RELEASE_FLAGS=$flags" >> "$GITHUB_ENV"
          if [ "$IS_RELEASE" = true ] && [ -n "$SHOREBIRD_TOKEN" ] && [ -f shorebird.yaml ]; then
            echo "USE_SHOREBIRD=true" >> "$GITHUB_ENV"
          fi

      # 没有上传密钥时 build.gradle.kts 回落到 debug 签名, 产物只能用于测试.
      - name: Restore upload key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Prepare Flutter build arguments
        if: env.USE_SHOREBIRD != 'true'
        run: |
          # 混淆映射让 Sentry 还原错误标题中的类名. shorebird release 带 --obfuscate 时自己把映射存到
          # build/shorebird/obfuscation_map.json (补丁按它保持命名不变), 不能再另加 --save-obfuscation-map, 所以这步只给 flutter build.
          if [ "$IS_RELEASE" = true ]; then
            echo "OBFUSCATION_MAP=--extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json" >> "$GITHUB_ENV"
          fi

      - name: Build APK with Flutter
        if: env.USE_SHOREBIRD != 'true'
        run: |
          flutter build apk --release $RELEASE_FLAGS $DEFINES $OBFUSCATION_MAP
          # Gradle 和 Kotlin 守护进程在 step 之间不会退出, 留着会和打 AAB 时的 Dart 编译争内存,
          # runner 内存不够时进程会被直接杀掉.
          (cd android && ./gradlew --stop)

      - name: Build AAB with Flutter
        if: env.USE_SHOREBIRD != 'true'
        run: flutter build appbundle --release $RELEASE_FLAGS $DEFINES $OBFUSCATION_MAP

      # 用 Shorebird 的引擎构建, 之后才能对这个版本推补丁. Flutter 版本必须和 .fvmrc 一致.
      - uses: shorebirdtech/setup-shorebird@v1
        if: env.USE_SHOREBIRD == 'true'
        with:
          cache: true
      - name: Build with Shorebird
        if: env.USE_SHOREBIRD == 'true'
        # --artifact=apk 在 aab 之外再出一个 apk, 供安装测试.
        run: |
          shorebird release android --artifact=apk \
            --flutter-version=${{ needs.check.outputs.flutter-version }} \
            $RELEASE_FLAGS -- $DEFINES

      # 从通用 APK 再拆出两个单架构 APK, 只带一种架构的原生库. 通用 APK 照常保留.
      # shorebird release 不支持 --split-per-abi, 所以两条路径都在构建后拆, 见脚本说明.
      - name: Split APK per ABI
        run: tool/split_apk.sh build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk app arm64-v8a armeabi-v7a

      # 两条构建路径都上传符号表和混淆映射, 只是映射的位置不同. 缺了任何一样都失败, 不跳过.
      - name: Upload symbols to Sentry
        if: env.IS_RELEASE == 'true' && env.SENTRY_AUTH_TOKEN != ''
        env:
          DART_SYMBOL_MAP: ${{ env.USE_SHOREBIRD == 'true' && 'build/shorebird/obfuscation_map.json' || 'build/app/obfuscation.map.json' }}
        run: tool/sentry_symbols.sh "eat@$BUILD_NAME+$BUILD_NUMBER" build/symbols "$DART_SYMBOL_MAP"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

  ios:
    name: iOS
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    env:
      IS_RELEASE: ${{ needs.check.outputs.release }}
      BUILD_NAME: ${{ needs.check.outputs.build-name }}
      BUILD_NUMBER: ${{ needs.check.outputs.build-number }}
      TESTFLIGHT: ${{ needs.check.outputs.testflight }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      # 去掉 geolocator 里的 requestAlwaysAuthorization 调用. App 只申请使用期间定位,
      # 留着这个调用会被 App Store 的静态扫描判成缺少「始终定位」用途说明 (ITMS-90683).
      BYPASS_PERMISSION_LOCATION_ALWAYS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
          channel: stable
          cache: true

      - run: flutter pub get
      # 先生成 vector_graphics_compiler 的快照, 原因见 check.
      - name: Warm up vector_graphics_compiler
        run: dart run vector_graphics_compiler --input=assets/icons/add.svg --output="$RUNNER_TEMP/warmup.vec"

      # 百度地图 iOS SDK 不入库, 从百度 CDN 下载并转成 xcframework. 脚本里写着版本和校验值, 按脚本内容缓存.
      - uses: actions/cache@v4
        with:
          path: packages/eat_baidu_map/ios/eat_baidu_map/Frameworks
          key: baidu-ios-sdk-${{ hashFiles('tool/baidu_ios_sdk.sh') }}
      - run: tool/baidu_ios_sdk.sh

      - name: Prepare build arguments
        run: |
          # RELEASE_FLAGS 是 flutter build 和 shorebird release 都认的选项, shorebird release 要求写在 -- 之前;
          # DEFINES 交给 flutter build, 用 shorebird 时写在 -- 之后.
          flags="--build-name=$BUILD_NAME --build-number=$BUILD_NUMBER"
          defines=""
          if [ -n "$APP_CONFIG" ]; then
            printf '%s' "$APP_CONFIG" > config/ci.json
            defines="--dart-define-from-file=config/ci.json"
          fi
          # 发版构建混淆 Dart 代码, 和安卓一样. 补丁 (patch.yml) 的选项要和这里保持一致, 否则 Shorebird 拒绝打补丁.
          if [ "$IS_RELEASE" = true ]; then
            flags="$flags --obfuscate --split-debug-info=build/symbols"
          fi
          echo "RELEASE_FLAGS=$flags" >> "$GITHUB_ENV"
          echo "DEFINES=$defines" >> "$GITHUB_ENV"

      # 有证书和描述文件时签名打 IPA, 没有时只做未签名构建, 验证能否编译.
      - name: Prepare signing
        if: env.IOS_DIST_CERT_P12_BASE64 != ''
        run: |
          tool/ios_signing.sh setup
          echo "SIGNED=true" >> "$GITHUB_ENV"
          # 发版且配了 Shorebird 时用 Shorebird 的引擎打 IPA, 之后才能对这个版本推补丁. 需要签名, 所以放在这一步之后判断.
          if [ "$IS_RELEASE" = true ] && [ -n "$SHOREBIRD_TOKEN" ] && [ -f shorebird.yaml ]; then
            echo "USE_SHOREBIRD=true" >> "$GITHUB_ENV"
          fi

      # 混淆映射的用处和安卓一样. shorebird release 自己存映射, 所以只在这里加.
      - name: Build IPA
        if: env.SIGNED == 'true' && env.USE_SHOREBIRD != 'true'
        run: |
          map=""
          if [ "$IS_RELEASE" = true ]; then
            map="--extra-gen-snapshot-options=--save-obfuscation-map=build/ios/obfuscation.map.json"
          fi
          flutter build ipa --release --export-options-plist=build/ios/ExportOptions.plist $RELEASE_FLAGS $DEFINES $map

      # Flutter 版本必须和 .fvmrc 一致. 产物和 flutter build ipa 一样在 build/ios/ipa/ 下, 后面的上传步骤不用分开写.
      - uses: shorebirdtech/setup-shorebird@v1
        if: env.USE_SHOREBIRD == 'true'
        with:
          cache: true
      - name: Build IPA with Shorebird
        if: env.USE_SHOREBIRD == 'true'
        run: |
          shorebird release ios             --flutter-version=${{ needs.check.outputs.flutter-version }}             --export-options-plist=build/ios/ExportOptions.plist             $RELEASE_FLAGS -- $DEFINES

      - name: Build unsigned
        if: env.SIGNED != 'true'
        run: |
          flutter build ios --release --no-codesign $RELEASE_FLAGS $DEFINES
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/Runner.app.zip

      # 符号表, 混淆映射和 xcarchive 里的 dSYM 都上传, 缺了任何一样都失败. 未签名的包装不到手机上, 不传.
      - name: Upload symbols to Sentry
        if: env.IS_RELEASE == 'true' && env.SIGNED == 'true' && env.SENTRY_AUTH_TOKEN != ''
        env:
          DART_SYMBOL_MAP: ${{ env.USE_SHOREBIRD == 'true' && 'build/shorebird/obfuscation_map.json' || 'build/ios/obfuscation.map.json' }}
        run: |
          tool/sentry_symbols.sh "eat@$BUILD_NAME+$BUILD_NUMBER" build/symbols "$DART_SYMBOL_MAP" \
            build/ios/archive/Runner.xcarchive/dSYMs

      # 上传是同步的, 命令返回时 App Store Connect 的上传记录里已经有这个构建, 下一次构建查号能看到它.
      - name: Upload to TestFlight
        if: env.SIGNED == 'true' && env.TESTFLIGHT == 'true'
        run: |
          tool/testflight_upload.sh build/ios/ipa/*.ipa
          echo "已上传 TestFlight: $BUILD_NAME ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing
        if: always()
        run: tool/ios_signing.sh cleanup

      - uses: actions/upload-artifact@v7
        if: env.SIGNED == 'true'
        with:
          name: ios
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: env.SIGNED != 'true'
        with:
          name: ios-unsigned
          path: build/ios/Runner.app.zip
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ needs.check.outputs.release }}
      BUILD_NAME: ${{ needs.check.outputs.build-name }}
      BUILD_NUMBER: ${{ needs.check.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
          channel: stable
          cache: true

      - run: flutter pub get
      # 先生成 vector_graphics_compiler 的快照, 原因见 check.
      - name: Warm up vector_graphics_compiler
        run: dart run vector_graphics_compiler --input=assets/icons/add.svg --output="$RUNNER_TEMP/warmup.vec"

      # CanvasKit 从自己的域名加载, 默认的 www.gstatic.com 在大陆访问不到.
      # 构建号写进 version.json, 启动时读出, 作为崩溃上报的 release.
      - name: Build
        run: |
          args="--build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --no-web-resources-cdn"
          if [ -n "$APP_CONFIG" ]; then
            printf '%s' "$APP_CONFIG" > config/ci.json
            args="$args --dart-define-from-file=config/ci.json"
          fi
          if [ "$IS_RELEASE" = true ]; then
            args="$args --source-maps"
          fi
          flutter build web --release $args

      - name: Upload source maps to Sentry
        if: env.IS_RELEASE == 'true' && env.SENTRY_AUTH_TOKEN != ''
        run: |
          dart run sentry_dart_plugin \
            --sentry-define=url="$SENTRY_URL" \
            --sentry-define=org="$SENTRY_ORG" \
            --sentry-define=project="$SENTRY_PROJECT" \
            --sentry-define=release="eat@$BUILD_NAME+$BUILD_NUMBER" \
            --sentry-define=upload_debug_symbols=false \
            --sentry-define=upload_source_maps=true \
            --sentry-define=web_build_path=build/web

      # source map 只给 Sentry, 不随产物部署.
      - run: find build/web -name '*.map' -delete

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web
          if-no-files-found: error
          retention-days: 1

  # GitHub 上的产物只保留 1 天, 用来在 job 之间传递. 要分发和留存的产物上传到 R2,
  # 按目录区分保留期: release/ 和 patch/ 32 天, nightly/ 2 天, 由 R2 的生命周期规则删除.
  # PR 构建不上传.
  publish:
    name: Upload to R2
    needs: [check, android, ios, web]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && (needs.android.result == 'success'
      || needs.ios.result == 'success' || needs.web.result == 'success') }}
    runs-on: ubuntu-latest
    environment: Cloudflare R2
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 不支持新版 AWS CLI 默认附带的校验和.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      PUBLIC_URL: https://release.foofish.work
      BUILD_NAME: ${{ needs.check.outputs.build-name }}
      R2_PREFIX: ${{ needs.check.outputs.r2-prefix }}
    steps:
      # 只下载构建成功的产物, 每个产物放在以名字命名的目录里.
      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Upload
        if: env.R2_BUCKET != ''
        run: |
          set -euo pipefail
          out=upload
          mkdir -p "$out"
          if [ -d dist/android ]; then
            cp dist/android/flutter-apk/app-release.apk "$out/eat-$BUILD_NAME-universal.apk"
            cp dist/android/flutter-apk/app-arm64-v8a.apk "$out/eat-$BUILD_NAME-arm64-v8a.apk"
            cp dist/android/flutter-apk/app-armeabi-v7a.apk "$out/eat-$BUILD_NAME-armeabi-v7a.apk"
            cp dist/android/bundle/release/app-release.aab "$out/eat-$BUILD_NAME.aab"
          fi
          if [ -d dist/ios ]; then
            cp dist/ios/*.ipa "$out/eat-$BUILD_NAME.ipa"
          fi
          if [ -d dist/ios-unsigned ]; then
            cp dist/ios-unsigned/Runner.app.zip "$out/eat-$BUILD_NAME-ios-unsigned.zip"
          fi
          if [ -d dist/web ]; then
            (cd dist/web && zip -qr "../../$out/eat-$BUILD_NAME-web.zip" .)
          fi
          aws s3 cp "$out" "s3://$R2_BUCKET/$R2_PREFIX/" --recursive \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors
          {
            echo "### R2"
            for f in "$out"/*; do
              echo "- $PUBLIC_URL/$R2_PREFIX/$(basename "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
