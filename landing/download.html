* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {

.btn {

  text-decoration: none;

  user-select: none;

}
.btn:focus-visible, .tap:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn-solid {

/* 舞台 + 抽屉 */
.stage {

  transition: background-color var(--stage-switch) ease;
}

.plate {

  height: var(--size);
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  background: var(--ghost);

}

.plate img { position: absolute; display: block; max-width: none; }
.plate.bare { box-shadow: none !important; background: transparent; overflow: visible; }
.plate.bare svg { width: 100%; height: 100%; display: block; }

.sheet {
  position: relative;
  margin-top: calc(var(--sheet-overlap) * -1);
  background: var(--paper);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  padding: 10px calc(var(--space-20) + env(safe-area-inset-right)) var(--space-24) calc(var(--space-20) + env(safe-area-inset-left));

}
.handle { width: 36px; height: 4px; border-radius: 2px; background: var(--handle); margin: 0 auto 22px; }

/* 轻提示 */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(150px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 70;
  max-width: calc(min(100vw, var(--page-max)) - var(--space-20) * 2);

  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--paper);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms ease;
}
.toast.show { opacity: 1; }

/* 微信, QQ 内置浏览器的引导蒙层 */
.guide {

.guide.show { display: block; }
.guide-inner {

@media (prefers-reduced-motion: reduce) {

.hero {

</style>

    "apple": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path fill=\"currentColor\" d=\"M8.867 6.024c.47.046.922.198 1.358.37.57.224 1.146.538 1.775.538.914 0 1.762-.623 2.65-.824 1.897-.431 3.97.592 5.098 2.107.202.272.443.589.473.942.076.923-.85 1.002-1.384 1.479a2.52 2.52 0 0 0-.814 2.193 2.52 2.52 0 0 0 1.409 1.93c.367.174.71.254.891.658.216.478-.04.974-.212 1.419l-.294.696c-.785 1.734-2.074 3.6-3.885 4.37-.891.379-1.862.096-2.747-.15-.38-.106-.785-.251-1.185-.251s-.805.145-1.185.251c-.747.208-1.554.454-2.334.279-.658-.147-1.254-.548-1.765-.974-2.015-1.675-3.225-4.618-3.608-7.152-.446-2.952.449-6.186 3.39-7.46.736-.318 1.566-.5 2.369-.421m9.285 10.313c-2.668-1.709-2.91-5.403-.412-7.384a3.4 3.4 0 0 0-1.068-.686c-.349-.141-.744-.258-1.124-.264-.594-.009-1.153.308-1.688.519-.449.177-.914.331-1.396.383-.95.101-1.8-.168-2.665-.524-.36-.148-.726-.316-1.115-.364-.463-.058-.952.085-1.376.258a3.36 3.36 0 0 0-1.499 1.202 4.4 4.4 0 0 0-.634 1.465 6.6 6.6 0 0 0-.171 1.748c.067 2.296 1.449 6.075 3.583 7.245.089.049.217.12.332.143.33.067.735-.082 1.047-.166.536-.144 1.07-.325 1.625-.386.598-.066 1.169.04 1.746.192.436.115 1.299.451 1.744.36.566-.116 1.339-.92 1.686-1.348a8 8 0 0 0 .645-.921c.288-.472.524-.964.74-1.472M14.165 1.95c1.243.514.325 2.388-.341 2.998a3.24 3.24 0 0 1-1.515.778c-.362.078-.734.087-1.043-.15-.886-.68-.062-2.293.567-2.868a3.24 3.24 0 0 1 1.515-.778c.27-.058.553-.089.817.02\"/></svg>"
  };
  /** 盘子插画, 取自 assets/illustrations/luosifen.svg. */
  var HERO_PLATE = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true"><circle cx="103" cy="105" r="92" fill="#000000" fill-opacity="0.12"></circle><circle cx="100" cy="100" r="92" fill="#F7F3EC"></circle><circle cx="100" cy="100" r="91" fill="none" stroke="#E2DBCF" stroke-width="2"></circle><circle cx="100" cy="100" r="85" fill="none" stroke="#B5301C" stroke-width="3" stroke-dasharray="7 5"></circle><circle cx="100" cy="100" r="76" fill="#C23A1F"></circle><circle cx="100" cy="100" r="76" fill="none" stroke="#A82E17" stroke-width="5"></circle><g fill="#DA5530" opacity="0.9"><circle cx="70" cy="70" r="6"></circle><circle cx="136" cy="146" r="5"></circle><circle cx="58" cy="132" r="4"></circle><circle cx="150" cy="66" r="4"></circle></g><g fill="none" stroke="#F4E6C6" stroke-width="5" stroke-linecap="round"><path d="M56 96c8-8 16 8 24 0s16 8 24 0 16 8 24 0 16 8 22 0"></path><path d="M60 108c8-8 16 8 24 0s16 8 24 0 16 8 24 0 12 6 18 0"></path><path d="M66 84c8-8 16 8 24 0s16 8 24 0 16 8 22 0"></path><path d="M70 120c8-8 16 8 24 0s16 8 24 0 16 8 20 0"></path></g><g fill="#D89A5C" stroke="#B87A40" stroke-width="1"><ellipse cx="128" cy="66" rx="5" ry="3.5" transform="rotate(20 128 66)"></ellipse><ellipse cx="138" cy="72" rx="5" ry="3.5" transform="rotate(-30 138 72)"></ellipse><ellipse cx="124" cy="75" rx="5" ry="3.5"></ellipse><ellipse cx="76" cy="138" rx="5" ry="3.5" transform="rotate(40 76 138)"></ellipse><ellipse cx="86" cy="143" rx="5" ry="3.5"></ellipse></g><g fill="#EDD07A"><rect x="56" y="62" width="22" height="5" rx="2.5" transform="rotate(35 67 64)"></rect><rect x="62" y="56" width="18" height="5" rx="2.5" transform="rotate(20 71 58)"></rect><rect x="116" y="134" width="22" height="5" rx="2.5" transform="rotate(-25 127 136)"></rect></g><g fill="#E3A043"><rect x="134" y="94" width="20" height="12" rx="5" transform="rotate(15 144 100)"></rect><rect x="100" y="140" width="18" height="11" rx="5" transform="rotate(-20 109 145)"></rect></g><g fill="#4D9A3C"><path d="M90 58c6-6 16-4 18 2-6 4-14 4-18-2z"></path><path d="M146 118c4-6 12-6 14-1-4 5-10 5-14 1z"></path><path d="M48 112c4-6 12-6 14-1-4 5-10 5-14 1z"></path></g></svg>';

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  /** 只放行 http(s) 地址, 防止常量里填了 javascript: 之类. */
  function safeUrl(url) {
    if (typeof url !== 'string' || !url) return '';
    try {
      var u = new URL(url, location.href);
      return u.protocol === 'https:' || u.protocol === 'http:' ? u.href : '';
    } catch (e) { return ''; }
  }

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  /** 微信, QQ 的内置浏览器不让下载 APK, 也不能跳 App Store. QQ 浏览器 (MQQBrowser 且无 " QQ/") 是普通浏览器. */
  var inBlockedWebView = /MicroMessenger/i.test(ua) || /\sQQ\/[\d.]+/i.test(ua);
  var openHost = OPEN_HOST || location.host;
  /** 本页是在 OPEN_HOST 上打开的: 系统没把链接交给 App, 再链回 OPEN_HOST 也唤不起来. */
  var onOpenHost = !!OPEN_HOST && location.host === OPEN_HOST;

  var iosUrl = IOS_SUPPORTED ? safeUrl(DOWNLOAD_URL_IOS) : '';
  var iosIsTestFlight = /^https?:\/\/testflight\.apple\.com\//i.test(iosUrl);
  var androidVersion = typeof ANDROID_VERSION_TEXT === 'string' ? ANDROID_VERSION_TEXT.trim() : '';
  var PLATFORMS = {
    android: { logo: 'android', small: '安卓版', big: '下载', label: '下载安卓版', url: safeUrl(DOWNLOAD_URL_ANDROID), version: androidVersion },
    ios: {
      logo: 'apple',
      small: 'iPhone 版',
      big: iosIsTestFlight ? 'TestFlight' : 'App Store',
      label: iosIsTestFlight ? '在 TestFlight 下载 iPhone 版' : '在 App Store 下载 iPhone 版',
      url: iosUrl,
      version: '',
      offText: IOS_SUPPORTED ? '待接入' : '暂不支持'
    }
  };

  var toastTimer;
  function toast(message) {
    var node = document.getElementById('toast');
    node.textContent = message;
    node.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.classList.remove('show'); }, 3000);
  }

  var guide = document.getElementById('guide');
  var guideReturn = null;
  function showGuide(sub) {
    guideReturn = document.activeElement;
    document.getElementById('guide-sub').textContent = sub;
    guide.classList.add('show');
    document.body.classList.add('locked');
    document.getElementById('guide-close').focus();
  }
  function hideGuide() {
    if (!guide.classList.contains('show')) return;
    guide.classList.remove('show');
    document.body.classList.remove('locked');
    if (guideReturn && guideReturn.focus) guideReturn.focus();
    guideReturn = null;
  }
  document.getElementById('guide-close').addEventListener('click', hideGuide);
  guide.addEventListener('click', function (e) { if (e.target === guide) hideGuide(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideGuide(); });

  /** 一个平台的下载入口. 有地址时是链接, 没有时置灰, 不可点, 带「待接入」或「暂不支持」虚线标签. */
  function downloadEntry(key, primary) {
    var p = PLATFORMS[key];
    var entry = el(p.url ? 'a' : 'div', 'dl ' + (primary ? 'dl-primary' : 'dl-secondary') + (p.url ? '' : ' dl-off'));
    var logo = el('span', 'dl-logo');
    logo.setAttribute('aria-hidden', 'true');
    logo.innerHTML = LOGOS[p.logo];
    var text = el('span', 'dl-text');
    var small = el('span', 'dl-small');
    small.appendChild(el('span', null, p.small));
    if (!p.url) small.appendChild(el('span', 'chip-pending', p.offText || '待接入'));
    text.appendChild(small);
    text.appendChild(el('span', 'dl-big', p.big));
    if (p.version) text.appendChild(el('span', 'dl-version', p.version));
    entry.appendChild(logo);
    entry.appendChild(text);
    if (p.url) {
      entry.href = p.url;
      entry.rel = 'noopener';
      entry.setAttribute('aria-label', p.label + (p.version ? '，' + p.version : ''));
      if (inBlockedWebView) entry.addEventListener('click', function (e) { e.preventDefault(); showGuide('在浏览器里才能下载'); });
    } else {
      entry.setAttribute('role', 'link');
      entry.setAttribute('aria-disabled', 'true');
      entry.setAttribute('aria-label', p.label + '，' + (p.offText || '待接入'));
    }
    return entry;
  }

  (function renderDownloads() {
    var box = document.getElementById('downloads');
    if (isAndroid) {
      box.appendChild(downloadEntry('android', true));
      box.appendChild(downloadEntry('ios', false));
    } else if (isIOS) {
      box.appendChild(downloadEntry('ios', true));
      if (iosUrl && iosIsTestFlight) box.appendChild(el('p', 'dl-note', '需要先在 App Store 安装 TestFlight'));
      box.appendChild(downloadEntry('android', false));
    } else {
      document.getElementById('desktop-hint').hidden = false;
      box.classList.add('equal');
      box.appendChild(downloadEntry('android', true));
      box.appendChild(downloadEntry('ios', true));
    }
  })();

  /**
   * iOS: 不拦截, 由 <a href> 跳到 OPEN_HOST, 系统按 Universal Links 交给 App.
   * Android: 发一个 https 的 intent, 走 App Links 的 intent-filter; 没装时 Chrome 回到本页.
   */
  function openApp(e) {
    if (inBlockedWebView) { e.preventDefault(); showGuide('在浏览器里才能打开 App'); return; }
    if (isIOS) return;
    e.preventDefault();
    if (!isAndroid) { toast('请在手机上打开这个页面'); return; }
    var fallback = 'https://' + location.host + '/download';
    location.href = 'intent://' + openHost + OPEN_PATH + '#Intent;scheme=https;package=' + ANDROID_PACKAGE +
      ';S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
  }

  if (!onOpenHost && !(isIOS && !IOS_SUPPORTED)) {
    var openLink = document.getElementById('open-app-link');
    openLink.href = 'https://' + openHost + OPEN_PATH;
    openLink.addEventListener('click', openApp);
    document.getElementById('open-app').hidden = false;
  }

  if (!IOS_SUPPORTED) document.getElementById('ios-req').hidden = true;
  document.getElementById('hero-plate').innerHTML = HERO_PLATE;
})();
</script>
