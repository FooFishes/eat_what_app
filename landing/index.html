/* 舞台上的文字色固定在浅色值, 不随深色模式变化. */
:root { --stage-fg-dark: #231c18; --stage-fg-dark-soft: #4a3c31; --stage-fg-light: #ffffff; }

[data-stage="redoil"] { --stage: var(--stage-redoil); --on-stage: var(--stage-fg-light); --on-stage-soft: var(--paper-85); --ghost: var(--stage-ghost-dark); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }

/* 按钮: 能点的都是胶囊 */
.btn {

  border: 0;
  margin: 0;
  font: inherit;
  font-weight: 700;
  min-height: var(--tap);
  padding: 0 var(--space-20);

  align-items: center;
  justify-content: center;

.btn-outline { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-button-outline); }
.btn-outline:active { transform: translateY(1px); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn-disabled, .btn-disabled:active { background: var(--disabled-bg); color: var(--disabled-fg); cursor: default; transform: none; box-shadow: none; }
.btn-block { width: 100%; }
.btn-52 { min-height: 52px; font-size: 16px; }
.btn-48 { min-height: 48px; font-size: 15px; font-weight: 600; }

/* 通用的可点区域: 没有按钮外观的整块点击 */
.tap {
  appearance: none;
  border: 0;
  margin: 0;
  padding: 0;
  background: none;
  text-align: inherit;
  cursor: pointer;
  color: inherit;
  font: inherit;
  display: block;
  -webkit-user-select: none;
  user-select: none;

.stage {

}
.stage-center {

.stage-bar {

.stage-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-8); }

}
.stage-name {

}

.shop-name {

}

.plate {
  --size: min(62vw, 240px);
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  overflow: hidden;
  position: relative;

}
.stage-center .plate { box-shadow: 0 0 0 8px var(--plate-rim), 0 22px 40px rgba(0, 0, 0, 0.3); margin: var(--space-8) 0 var(--space-4); }
.plate img { position: absolute; display: block; max-width: none; }
.plate.bare { box-shadow: none !important; background: transparent; overflow: visible; }
.plate.bare svg { width: 100%; height: 100%; display: block; }

.sheet {
  position: relative;
  margin-top: calc(var(--sheet-overlap) * -1);
  background: var(--paper);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  padding: 10px calc(var(--space-20) + env(safe-area-inset-right)) var(--space-24) calc(var(--space-20) + env(safe-area-inset-left));

.handle { width: 36px; height: 4px; border-radius: 2px; background: var(--handle); margin: 0 auto 22px; }

.joined { display: flex; flex-direction: column; gap: var(--joined-gap); }
.joined > * { background: var(--mist); border-radius: var(--radius-joined); }

/* 数字条 (StatStrip) */
.stats { display: flex; align-items: stretch; }
.stat { flex: 1; min-width: 0; padding: 14px 8px 14px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat + .stat { position: relative; }
.stat + .stat::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 1px; background: var(--hairline); }

/* 上传者卡片 */
.uploader { padding: var(--space-16); display: flex; flex-direction: column; gap: var(--space-14); }

    }

    img.alt = alt || '';

    append(b, [img, line1]);
    var line2 = el('div', 'tile-line2');
    if (f.shop) line2.appendChild(el('span', 't-meta', f.shop));
    if (f.score) {
      line2.appendChild(el('span', 't-count', f.score));
      if (f.likes != null) line2.appendChild(el('span', 'gap'));
    }
    if (f.likes != null) {
      line2.appendChild(icon('heart'));
      line2.appendChild(el('span', 't-count', String(f.likes)));
    }
    if (line2.childNodes.length) b.appendChild(line2);
    b.setAttribute('aria-label', [name, price, f.shop, f.score ? '评分 ' + f.score : null, f.likes != null ? f.likes + ' 个赞' : null].filter(Boolean).join('，'));
    b.addEventListener('click', function () { askApp('这道菜的详情在 App 里看'); });
    return b;
  }
  function tileGrid(items) {
    var grid = el('div', 'tiles');
    items.forEach(function (f) { grid.appendChild(dishTile(f)); });
    return grid;
  }
  /** 平均分 "4.3 分", 没人评过时为 null (DishRules.scoreText). */
  function scoreText(rating) {
    if (!rating || typeof rating.score !== 'number' || !rating.count) return null;
    return rating.score.toFixed(1) + ' 分';
  }

  // ---- 菜品页 (lib/features/dish/dish_page.dart) ----
  function renderDish(food) {
    var id = food.id;
    var name = text(food.name) || '一道菜';
    var price = priceText(food.price);
    var category = text(food.category);
    var pictures = list(food.pictureUrls).filter(safeUrl);
    var uploaderId = typeof food.accountId === 'number' ? food.accountId : null;
    var stageName = dishStage(food.stageColor, category);
    var crop = pictures.length ? food.coverCrop : null;
    /** 大图浏览的照片: 上传者的在前, 评论里的在后. 游客看不到上传者昵称, 不标拍摄者. */
    var photos = pictures.map(function (u) { return { url: u, credit: null }; });

    // 舞台
    var height = clamp(window.innerHeight * 0.5, 360, 460);
    var stage = makeStage(stageName, height);
    var photoPill = barPill('image', '照片', function () { openViewer(photos, 0); }, '看大图');
    photoPill.hidden = !photos.length;
    function updatePhotoPill() {
      photoPill.hidden = !photos.length;
      photoPill.querySelector('.bar-pill-face span:last-child').textContent = '照片 ' + photos.length;
      photoPill.setAttribute('aria-label', '看大图，' + photos.length + ' 张');
    }
    updatePhotoPill();
    stage.appendChild(stageBar(photoPill, [
      barPill('edit', '编辑', function () { askApp('编辑要在 App 里操作'); }),
      barPill('bookmark', '收藏', function () { askApp('收藏要在 App 里操作'); }),
      barPill('share', '分享', function () { share(name); })
    ]));
    var plateBtn = el(photos.length ? 'button' : 'div', 'stage-plate');
    if (photos.length) {
      plateBtn.type = 'button';
      plateBtn.setAttribute('aria-label', '看大图');
      plateBtn.addEventListener('click', function () { openViewer(photos, 0); });
    }
    stage.appendChild(plateBtn);
    var textBox = el('div', 'stage-text');
    var chips = [food.signature ? '招牌' : null, category].filter(Boolean);
    if (chips.length) {
      var chipRow = el('div', 'stage-chips');
      chips.forEach(function (c) { chipRow.appendChild(el('span', 'stage-chip', c)); });
      textBox.appendChild(chipRow);
    }
    var lines = stageLines(name);
    var nameNode = el('h1', 'stage-name', lines.join('\n'));
    nameNode.setAttribute('aria-label', name);
    textBox.appendChild(nameNode);
    var priceNode = price ? el('p', 'stage-price', price) : null;
    if (priceNode) textBox.appendChild(priceNode);
    stage.appendChild(textBox);

    relayout = function () {
      var w = stageWidth(stage);
      var size = clamp(height * 0.56, 200, 280);
      var cx = w - size * 0.26;
      var cy = 52 + (height - 32 - 52) / 2 + 6;
      plateBtn.replaceChildren(plate(pictures[0], crop, name, size));
      plateBtn.style.left = (cx - size / 2) + 'px';
      plateBtn.style.top = (cy - size / 2) + 'px';
      var scale = stageTextScale(w);
      var longest = lines.reduce(function (m, l) { return Math.max(m, Array.from(l).length); }, 0);
      var nameSize = (lines.length >= 3 ? 36 : longest >= 4 ? 40 : 44) * scale;
      nameNode.style.fontSize = nameSize + 'px';
      nameNode.style.lineHeight = (nameSize + 4) + 'px';
      textBox.style.width = (200 * scale) + 'px';
      if (priceNode) priceNode.style.fontSize = (48 * scale) + 'px';
    };

    // 抽屉: 数字条, 上传者, 店连成一组
    var sheet = makeSheet();
    var group = el('div', 'joined');
    var tags = list(food.tags).map(text).filter(Boolean).slice(0, 3);
    var rating = food.rating || {};
    var ratingCount = num(rating.count, 0);
    var score = scoreText(rating);
    var likes = num(food.likeCount, 0);
    var heartRow = el('span');
    heartRow.style.cssText = 'display: flex; align-items: center; gap: 8px;';
    append(heartRow, [icon('heart'), el('span', 'v v-num', String(likes))]);
    group.appendChild(statStrip([
      {
        label: ratingCount === 0 ? '评分' : ratingCount + ' 人评分',
        value: score ? rating.score.toFixed(1) : '—',
        footNode: emptyStars(),
        aria: '评分，' + (score ? score + '，' + ratingCount + ' 人评过' : ratingCount ? ratingCount + ' 人评过' : '还没人评分') + '，点了打分',
        onTap: function () { askApp('打分要在 App 里操作'); }
      },
      {
        label: '赞',
        value: String(likes),
        valueNode: heartRow,
        note: '点一下赞',
        aria: '赞，' + likes,
        toggled: false,
        onTap: function () { askApp('点赞要在 App 里操作'); }
      },
      {
        label: '口味',
        value: tags.length ? tags.join('、') : '—',
        note: tags.length ? null : '还没标口味'
      }
    ]));

    // 上传者卡片: 游客看不到昵称, 写 "同学"; 账号已注销时写 "已注销用户" 且不可点.
    var uploaderName = uploaderId == null ? '已注销用户' : '同学';
    var card = el(uploaderId == null ? 'div' : 'button', 'uploader' + (uploaderId == null ? '' : ' tap'));
    var desc = text(food.description);
    if (desc) card.appendChild(el('p', 'uploader-desc', desc));
    var uRow = el('div', 'uploader-row');
    append(uRow, [avatar(uploaderName, uploaderId || 0, null, 28), el('span', 'uploader-name', uploaderName)]);
    var created = fromMillis(food.createdAt);
    if (created) uRow.appendChild(el('span', 'uploader-date', dateText(created, new Date()) + '上传'));
    card.appendChild(uRow);
    if (uploaderId != null) {
      card.type = 'button';
      card.addEventListener('click', function () { askApp('同学的主页在 App 里看'); });
    }
    group.appendChild(card);

    // 店: 门头照, 店名, 商圈和地址. 距离要定位, 落地页不显示.
    var shopRow = el('button', 'tap list-row');
    shopRow.type = 'button';
    var shopThumb = el('div', 'photo-thumb');
    shopThumb.appendChild(icon('store'));
    var shopText = el('div', 'list-row-text');
    var shopName = text(food.restaurantName) || '这家店';
    shopText.appendChild(el('span', 'list-row-title', shopName));
    var shopLine = el('span', 'list-row-line');
    shopText.appendChild(shopLine);
    append(shopRow, [shopThumb, shopText, icon('chevron-right')]);
    shopRow.addEventListener('click', function () { askApp('这家店的详情在 App 里看'); });
    group.appendChild(shopRow);
    sheet.appendChild(group);

    var topicSlot = el('div');
    sheet.appendChild(topicSlot);

    // 吃过的人说
    var commentsSection = el('section', 'section');
    commentsSection.setAttribute('aria-label', '吃过的人说');
    var head = sectionHead('吃过的人说');
    var composer = el('div', 'composer');
    var pill = el('button', 'tap composer-pill');
    pill.type = 'button';
    append(pill, [icon('edit'), el('span', null, '吃过的话，说两句')]);
    pill.setAttribute('aria-label', '写一条');
    pill.addEventListener('click', function () { askApp('写评论要在 App 里操作'); });
    var cam = el('button', 'tap camera-circle');
    cam.type = 'button';
    cam.setAttribute('aria-label', '带照片写一条');
    cam.appendChild(icon('camera'));
    cam.addEventListener('click', function () { askApp('写评论要在 App 里操作'); });
    append(composer, [pill, cam]);
    var commentBox = el('div', 'comments');
    commentBox.appendChild(skeletonRows(2));
    append(commentsSection, [head, composer, commentBox]);
    sheet.appendChild(commentsSection);
    sheet.appendChild(footLinks([['修改记录', function () { askApp('修改记录在 App 里看'); }]]));

    mount([stage, sheet]);
    relayout();
    setThemeColor(stage);
    setMeta(name, [price, text(food.restaurantName)].filter(Boolean).join('，') || null);

    // 次要数据: 失败时不显示对应的块.
    if (typeof food.restaurantId === 'number') {
      api('/restaurant/detail/' + food.restaurantId).then(function (shop) {
        if (!shop) return;
        var photo = cover(shop.pictureUrl, '');
        if (photo) shopThumb.replaceChildren(photo);
        shopLine.textContent = [text(shop.hubName), text(shop.address)].filter(Boolean).join('  ');
      }).catch(function () {});
    }
    api('/foods/' + id + '/gallery', { page: 1, pageSize: 50 }).then(function (data) {
      pageItems(data).forEach(function (g) {
        var url = safeUrl(g && g.url);
        if (url && typeof g.commentId === 'number') photos.push({ url: url, credit: text(g.author && g.author.displayName) });
      });
      if (photos.length && plateBtn.tagName !== 'BUTTON') {
        var btn = el('button', 'stage-plate');
        btn.type = 'button';
        btn.setAttribute('aria-label', '看大图');
        btn.style.cssText = plateBtn.style.cssText;
        btn.addEventListener('click', function () { openViewer(photos, 0); });
        plateBtn.replaceWith(btn);
        plateBtn = btn;
        relayout();
      }
      updatePhotoPill();
    }).catch(function () {});
    api('/topics/by-food/' + id).then(function (topics) {
      var sorted = list(topics).filter(function (t) { return t && typeof t.id === 'number' && !isNaN(Date.parse(t.startsAt)) && !isNaN(Date.parse(t.endsAt)); })
        .sort(function (a, b) { return Date.parse(b.startsAt) - Date.parse(a.startsAt); });
      var topic = sorted[0];
      if (!topic) return;
      var now = Date.now();
      var current = now >= Date.parse(topic.startsAt) && now < Date.parse(topic.endsAt);
      var label = (current ? '收进了本周专题' : '收进了专题') + '「' + (text(topic.name) || '') + '」';
      var hint = el('button', 'tap topic-hint');
      hint.type = 'button';
      append(hint, [icon('topic'), el('span', null, label)]);
      hint.addEventListener('click', function () { askApp('这期专题在 App 里看'); });
      topicSlot.appendChild(hint);
    }).catch(function () {});
    api('/foods/' + id + '/comments', { sort: 'HOT', page: 1, pageSize: 3 }).then(function (data) {
      var total = num(data && data.totalItems, 0);
      var items = pageItems(data).filter(function (c) { return c && typeof c.id === 'number' && c.author && typeof c.author.id === 'number'; }).slice(0, 3);
      if (total > 0) head.appendChild(el('span', 't-count', String(total)));
      commentBox.replaceChildren();
      if (!items.length) {
        commentBox.appendChild(el('p', 'empty-line', '还没有人说过，来写第一条'));
        return;
      }
      items.forEach(function (c) { commentBox.appendChild(commentCard(c, uploaderId, false)); });
      var all = mistButton('看全部 ' + Math.max(total, items.length) + ' 条', function () { askApp('全部评论在 App 里看'); });
      all.classList.add('see-all');
      commentBox.appendChild(all);
    }).catch(function () { commentsSection.remove(); });
  }

  /**
   * 一条评论 (CommentCard): 头像, 昵称 (上传者带 "上传者" 小标, 回复写 "A 回复 B"), 正文, 附图,
   * 最下面一行时间, "回应", 表情回应, 右边赞和 "更多". 回复挂在正文下面, 头像小一号.
   */
  function commentCard(c, uploaderId, isReply) {
    var row = el('div', 'comment');
    var authorName = text(c.author.displayName) || '同学';
    row.appendChild(avatar(authorName, c.author.id, c.author.avatar, isReply ? 24 : 32));
    var main = el('div', 'comment-main');
    var textRow = el('div', 'comment-text-row');
    var textCol = el('div', 'comment-text');
    var byline = el('div', 'byline');
    byline.appendChild(document.createTextNode(authorName));
    if (uploaderId != null && c.author.id === uploaderId) byline.appendChild(el('span', 'uploader-tag', '上传者'));
    var toName = c.replyTo && text(c.replyTo.displayName);
    if (toName) {
      byline.appendChild(el('span', 'reply-word', ' 回复 '));
      byline.appendChild(document.createTextNode(toName));
    }
    textCol.appendChild(byline);
    var body = typeof c.text === 'string' ? c.text : '';
    if (body) textCol.appendChild(el('p', 'comment-body', body));
    var replyBtn = el('button', 'tap reply-btn');
    replyBtn.type = 'button';
    replyBtn.setAttribute('aria-label', '回复');
    append(replyBtn, [el('span', null, '回复'), icon('chevron-right')]);
    replyBtn.addEventListener('click', function () { askApp('回复要在 App 里操作'); });
    append(textRow, [textCol, replyBtn]);
    main.appendChild(textRow);

    var pics = list(c.pictureUrls).filter(safeUrl).slice(0, 3);
    if (pics.length && !isReply) {
      var strip = el('div', 'comment-photos');
      pics.forEach(function (u, i) {
        var b = el('button', 'tap comment-photo');
        b.type = 'button';
        b.setAttribute('aria-label', '看' + authorName + '拍的第 ' + (i + 1) + ' 张照片');
        var img = cover(u, '');
        if (img) b.appendChild(img);
        b.addEventListener('click', function () {
          openViewer(pics.map(function (p) { return { url: safeUrl(p), credit: authorName }; }), i);
        });
        strip.appendChild(b);
      });
      main.appendChild(strip);
    }

    var actions = el('div', 'comment-actions');
    var left = el('div', 'comment-actions-left');
    var created = fromMillis(c.createdAt);
    left.appendChild(el('span', 'comment-time', created ? relativeText(created, new Date()) : ''));
    var react = el('button', 'tap text-action', '回应');
    react.type = 'button';
    react.addEventListener('click', function () { askApp('回应要在 App 里操作'); });
    left.appendChild(react);
    var counts = {};
    list(c.reactions).forEach(function (r) { if (r && num(r.count, 0) > 0) counts[r.reaction] = r.count; });
    var bar = el('div', 'reactions');
    REACTIONS.forEach(function (r) {
      if (!counts[r[0]]) return;
      var b = el('button', 'tap reaction');
      b.type = 'button';
      b.setAttribute('aria-label', r[2] + '，' + counts[r[0]]);
      var face = el('span', 'reaction-face');
      append(face, [emoji(r[1]), el('span', 't-count', String(counts[r[0]]))]);
      b.appendChild(face);
      b.addEventListener('click', function () { askApp('回应要在 App 里操作'); });
      bar.appendChild(b);
    });
    if (bar.childNodes.length) left.appendChild(bar);
    var likes = num(c.likeCount, 0);
    var like = el('button', 'tap like-btn');
    like.type = 'button';
    like.setAttribute('aria-label', '赞，' + likes);
    like.setAttribute('aria-pressed', 'false');
    like.appendChild(icon('heart'));
    if (likes > 0) like.appendChild(el('span', 't-count', String(likes)));
    like.addEventListener('click', function () { askApp('点赞要在 App 里操作'); });
    var more = el('button', 'tap more-btn');
    more.type = 'button';
    more.setAttribute('aria-label', '更多');
    more.appendChild(icon('more'));
    more.addEventListener('click', function () { askApp('举报要在 App 里操作'); });
    append(actions, [left, like, more]);
    main.appendChild(actions);

    if (!isReply && num(c.replyCount, 0) > 0) {
      var replies = el('div', 'replies');
      main.appendChild(replies);
      loadReplies(c, replies, uploaderId);
    }
    row.appendChild(main);
    return row;
  }

  /** 回复默认显示最早的 2 条, 其余收在 "展开 N 条回复" 里; 请求失败时不显示回复. */
  function loadReplies(root, box, uploaderId) {
    api('/comments/' + root.id + '/replies', { page: 1, pageSize: 20 }).then(function (data) {
      var items = pageItems(data).filter(function (c) { return c && typeof c.id === 'number' && c.author && typeof c.author.id === 'number'; });
      var total = Math.max(num(data && data.totalItems, items.length), items.length);
      var shown = 0;
      function draw(count) {
        box.replaceChildren();
        shown = Math.min(count, items.length);
        items.slice(0, shown).forEach(function (r) { box.appendChild(commentCard(r, uploaderId, true)); });
        var hidden = total - shown;
        if (hidden <= 0) return;
        var b = el('button', 'tap expand-btn');
        b.type = 'button';
        b.appendChild(el('span', null, '展开 ' + hidden + ' 条回复'));
        b.appendChild(icon('chevron-down'));
        b.addEventListener('click', function () {
          if (shown < items.length) draw(items.length);
          else askApp('全部回复在 App 里看');
        });
        box.appendChild(b);
      }
      draw(2);
    }).catch(function () {});
  }

  // ---- 店铺页 (lib/features/shop/shop_page.dart) ----
  function renderShop(shop) {
    var id = shop.id;
    var name = text(shop.name) || '一家店';
    var categories = list(shop.categories).map(text).filter(Boolean);
    var tastes = list(shop.tags).map(text).filter(Boolean);
    var closed = shop.permanentlyClosed === true;
    var address = text(shop.address);
    var photo = safeUrl(shop.pictureUrl);
    var stageName = shopStage(shop);

    // 舞台: 招牌菜的盘子扇形排开, 没有招牌时是门头照, 门头照也没有时放菜单的第一道菜.
    var height = clamp(window.innerHeight * 520 / 844, 420, 560);
    var stage = makeStage(stageName, height);
    stage.appendChild(stageBar(null, [
      barPill('edit', '编辑', function () { askApp('编辑要在 App 里操作'); }, '编辑店铺'),
      barPill('bookmark', '收藏', function () { askApp('收藏要在 App 里操作'); }, '收藏店铺'),
      barPill('share', '分享', function () { share(name); })
    ]));
    var plates = el('div');
    stage.appendChild(plates);
    var textBox = el('div', 'stage-text');
    textBox.style.right = 'calc(var(--space-20) + env(safe-area-inset-right))';
    textBox.style.bottom = 'calc(var(--sheet-overlap) + 28px)';
    var nameNode = el('h1', 'stage-name shop-name', name);
    textBox.appendChild(nameNode);
    if (address) textBox.appendChild(el('p', 'stage-sub', address));
    if (closed) textBox.appendChild(el('p', 'stage-closed', '这家店已关门'));
    stage.appendChild(textBox);

    var signatures = null;
    var firstOnMenu = null;
    var menuReady = false;
    function drawPlates() {
      var w = stageWidth(stage);
      var scale = height / 520;
      var big = 196 * scale, small = big * 0.65;
      var cx = w * 0.56, cy = 205 * scale;
      var spread = big * 0.68, sink = big * 0.14;
      var dishes = (signatures || []).slice(0, 3);
      var hero = dishes[0] || (photo ? null : firstOnMenu);
      var heroUrl = signatures == null ? null : dishes[0] ? dishes[0].picture : photo || (firstOnMenu && firstOnMenu.picture);
      if (signatures != null && !dishes.length && !photo && !menuReady) heroUrl = null;
      function one(x, y, size, url, dish) {
        var wrap = el(dish ? 'button' : 'div', 'stage-plate');
        wrap.style.left = (x - size / 2) + 'px';
        wrap.style.top = (y - size / 2) + 'px';
        if (dish) {
          wrap.type = 'button';
          wrap.setAttribute('aria-label', (dish.signature ? '招牌菜 ' : '') + dish.name);
          wrap.addEventListener('click', function () { askApp('这道菜的详情在 App 里看'); });
        }
        wrap.appendChild(plate(url, null, '', size));
        return wrap;
      }
      var nodes = [];
      if (dishes.length > 2) nodes.push(one(cx - spread, cy + sink, small, dishes[2].picture, dishes[2]));
      if (dishes.length > 1) nodes.push(one(cx + spread, cy + sink, small, dishes[1].picture, dishes[1]));
      nodes.push(one(cx, cy, big, heroUrl, hero));
      plates.replaceChildren.apply(plates, nodes);
    }
    relayout = function () {
      drawPlates();
      var w = stageWidth(stage);
      var scale = stageTextScale(w);
      var sizes = [40, 36, 32, 28];
      for (var i = 0; i < sizes.length; i++) {
        var size = sizes[i] * scale;
        nameNode.style.fontSize = size + 'px';
        nameNode.style.lineHeight = (size + 4) + 'px';
        nameNode.style.webkitLineClamp = 'unset';
        var fits = nameNode.scrollHeight <= (size + 4) * 2 + 1;
        nameNode.style.webkitLineClamp = '';
        if (fits) break;
      }
    };

    // 抽屉: 数字条和品类口味连成一组, 导航和加菜, 全部菜品.
    var sheet = makeSheet();
    var group = el('div', 'joined');
    var rate = rateOf(shop);
    var dineCount = num(shop.dineIn && shop.dineIn.count, 0) + num(shop.delivery && shop.delivery.count, 0);
    var summary = rate ? rate.count + ' 人评过' : dineCount === 0 ? '还没人评价' : dineCount + ' 条评价';
    var stats = function (total) {
      return statStrip([
        {
          label: rate && rate.delivery ? '外卖推荐率' : '推荐率',
          value: rate ? rate.percent + '%' : '—',
          note: summary,
          aria: ['评价', rate ? (rate.delivery ? '外卖 ' : '') + rate.percent + '% 推荐' : null, summary].filter(Boolean).join('，'),
          onTap: function () { askApp('评价要在 App 里操作'); }
        },
        { label: '菜单', value: total == null ? '—' : String(total), unit: total == null ? null : '道菜', aria: total == null ? null : total + ' 道菜' },
        { label: '距离', value: '—', note: text(shop.hubName) || '' }
      ]);
    };
    var statNode = stats(null);
    group.appendChild(statNode);
    if (categories.length || tastes.length) {
      var facts = el('dl', 'facts');
      if (categories.length) append(facts, [el('dt', null, '品类'), el('dd', null, categories.join('、'))]);
      if (tastes.length) append(facts, [el('dt', null, '口味'), el('dd', null, tastes.join('、'))]);
      group.appendChild(facts);
    }
    sheet.appendChild(group);

    var actions = el('div', 'shop-actions');
    var nav = el('button', 'btn btn-52 ' + (closed ? 'btn-disabled' : 'btn-solid'));
    nav.type = 'button';
    append(nav, [icon('navigate'), el('span', null, '导航去店里')]);
    var add = el('button', 'btn btn-52 ' + (closed ? 'btn-disabled' : 'btn-outline'));
    add.type = 'button';
    append(add, [icon('add'), el('span', null, '加一道菜')]);
    if (closed) {
      nav.disabled = true;
      add.disabled = true;
    } else {
      nav.addEventListener('click', function () { askApp('导航要在 App 里操作'); });
      add.addEventListener('click', function () { askApp('加菜要在 App 里操作'); });
    }
    append(actions, [nav, add]);
    sheet.appendChild(actions);

    var menu = el('section', 'section');
    menu.setAttribute('aria-label', '全部菜品');
    var menuHead = sectionHead('全部菜品');
    var menuBody = el('div');
    var sk = el('div', 'tiles');
    sk.style.marginTop = '14px';
    for (var i = 0; i < 4; i++) sk.appendChild(el('div', 'sk sk-block'));
    menuBody.appendChild(sk);
    append(menu, [menuHead, menuBody]);
    sheet.appendChild(menu);
    sheet.appendChild(footLinks([
      ['修改记录', function () { askApp('修改记录在 App 里看'); }],
      ['信息有误', function () { askApp('反馈信息有误要在 App 里操作'); }]
    ]));

    mount([stage, sheet]);
    relayout();
    setThemeColor(stage);
    setMeta(name, categories.join('，') || null);

    function toTile(f) {
      return {
        id: f.id, name: text(f.name) || '一道菜', price: f.price, signature: f.signature === true,
        category: text(f.category), picture: list(f.pictureUrls)[0], crop: f.coverCrop,
        likes: num(f.likeCount, 0), score: scoreText(f.rating)
      };
    }
    api('/foods/list', { restaurantId: id, signatureOnly: true, sort: 'MENU', page: 1, pageSize: 3 }).then(function (data) {
      signatures = pageItems(data).filter(function (f) { return f && typeof f.id === 'number'; }).map(toTile);
    }).catch(function () { signatures = []; }).then(function () { drawPlates(); });

    var dishes = [];
    var groupsBox = null;
    var page = 1;
    var lastGroup = null;
    function groupOf(d) { return d.signature ? '招牌' : d.category || '其他'; }
    function appendDishes(items) {
      items.forEach(function (d) {
        var title = groupOf(d);
        if (!lastGroup || lastGroup.title !== title) {
          var t = el('div', 'group-title');
          t.setAttribute('role', 'heading');
          t.setAttribute('aria-level', '3');
          var count = el('span', 't-count');
          append(t, [el('strong', null, title), count]);
          var grid = el('div', 'tiles');
          append(groupsBox, [t, grid]);
          lastGroup = { title: title, count: count, grid: grid, n: 0 };
        }
        lastGroup.n += 1;
        lastGroup.count.textContent = String(lastGroup.n);
        lastGroup.grid.appendChild(dishTile(d));
      });
    }
    function loadMenu() {
      return api('/foods/list', { restaurantId: id, sort: 'MENU', page: page, pageSize: 20 });
    }
    loadMenu().then(function (data) {
      var items = pageItems(data).filter(function (f) { return f && typeof f.id === 'number'; }).map(toTile);
      var total = num(data && data.totalItems, items.length);
      dishes = items;
      firstOnMenu = items[0] || null;
      menuReady = true;
      drawPlates();
      var fresh = stats(total);
      statNode.replaceWith(fresh);
      statNode = fresh;
      menuHead.appendChild(el('span', 't-count', String(total)));
      menuBody.replaceChildren();
      if (!items.length) {
        menuBody.appendChild(emptyState('bowl', '这家店还没有菜', '吃过的话，加一道菜让大家知道。'));
        return;
      }
      groupsBox = el('div');
      menuBody.appendChild(groupsBox);
      appendDishes(items);
      if (data && data.hasNext) {
        var more = mistButton('看更多菜', function () {
          more.disabled = true;
          page += 1;
          loadMenu().then(function (next) {
            var nextItems = pageItems(next).filter(function (f) { return f && typeof f.id === 'number'; }).map(toTile);
            dishes = dishes.concat(nextItems);
            appendDishes(nextItems);
            more.disabled = false;
            if (!(next && next.hasNext)) more.remove();
          }).catch(function () {
            page -= 1;
            more.disabled = false;
            toast('加载失败，请重试');
          });
        });
        more.classList.add('load-more');
        menuBody.appendChild(more);
      }
    }).catch(function () {
      menu.remove();
      menuReady = true;
      drawPlates();
    });
  }

  /**
   * 推荐率: 一个场景的评价满 3 条才显示, 堂食优先, 堂食不够而外卖够时写外卖的 (ShopRules.rateOf).
   */
  function rateOf(shop) {
    var scenes = [[shop.dineIn, false], [shop.delivery, true]];
    for (var i = 0; i < scenes.length; i++) {
      var stat = scenes[i][0] || {};
      if (num(stat.count, 0) >= 3 && typeof stat.rate === 'number') {
        return { percent: Math.round(stat.rate * 100), count: stat.count, delivery: scenes[i][1] };
      }
    }
    return null;
  }

  // ---- 专题页 (lib/features/topic/topic_page.dart): 白底页 ----
  function renderTopic(detail) {
    var topic = detail.topic || {};
    var startsAt = Date.parse(topic.startsAt), endsAt = Date.parse(topic.endsAt);
    if (typeof topic.id !== 'number' || isNaN(startsAt) || isNaN(endsAt)) throw new Error('topic');
    var foods = list(detail.foods).filter(function (f) { return f && typeof f.id === 'number'; })
      .sort(function (a, b) { return num(a.position, 0) - num(b.position, 0); });
    var title = text(topic.name) || '专题';
    var box = el('section', 'plain');
    var head = el('div', 'plain-head');
    head.appendChild(el('h1', null, title));
    var shareBtn = el('button', 'tap icon-btn');
    shareBtn.type = 'button';
    shareBtn.setAttribute('aria-label', '分享');
    shareBtn.appendChild(icon('share'));
    shareBtn.addEventListener('click', function () { share('「' + title + '」'); });
    head.appendChild(shareBtn);
    box.appendChild(head);
    var intro = text(topic.introduction);
    if (intro) box.appendChild(el('p', 'topic-intro', intro));

    var now = new Date();
    var current = now.getTime() >= startsAt && now.getTime() < endsAt;
    var start = new Date(startsAt);
    var last = new Date(Math.max(endsAt - 1, startsAt));
    var meta = el('div', 'topic-meta');
    var kind = el('span', 'topic-kind');
    append(kind, [icon('topic'), el('span', null, current ? '本周专题' : '往期专题')]);
    var count = el('span');
    append(count, [el('span', 't-count', String(num(topic.visibleFoodCount, 0))), ' 道菜']);
    append(meta, [kind, el('span', null, dateText(start, now) + '–' + dateText(last, now)), count]);
    box.appendChild(meta);

    if (!foods.length) {
      box.appendChild(emptyState('bowl', '这期专题暂无菜品', '看看其他推荐的菜。'));
    } else {
      box.appendChild(tileGrid(foods.map(function (f) {
        return { name: f.name, price: f.price, picture: list(f.pictureUrl)[0], shop: text(f.restaurantName) };
      })));
    }
    relayout = null;
    mount([box]);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', getComputedStyle(document.querySelector('.page')).backgroundColor);
    setMeta('「' + title + '」', intro);
  }

  function renderIntro() {
    relayout = null;
    var stage = el('section', 'stage stage-center');
    stage.setAttribute('data-stage', FALLBACK_STAGE);
    var box = el('div', 'plate bare');
    box.innerHTML = EMPTY_PLATE;
    append(stage, [el('div', 'stage-kicker', '校园觅食'), box]);
    var points = el('ul', 'points');
    ['转一转，换一道菜', '看附近的店和招牌菜', '同学们拍的照片和评价'].forEach(function (t) {
      var li = el('li');
      li.appendChild(icon('check'));
      li.appendChild(el('span', null, t));
      points.appendChild(li);
    });
    var sheet = makeSheet();
    append(sheet, [
      el('h1', 'title title-sm', '在 App 里看看今天吃什么'),
      el('p', 'lead', '这个链接要在 App 里打开。还没有装的话，先下载 App。'),
      points
    ]);
    mount([stage, sheet]);
    setThemeColor(stage);
    setMeta(null, null);
  }

  // ---- 路由 ----
  var ROUTES = {
    dishes: { api: function (id) { return '/foods/detail/' + id; }, render: renderDish },
    shops: { api: function (id) { return '/restaurant/detail/' + id; }, render: renderShop },
    topics: { api: function (id) { return '/topics/' + id; }, render: renderTopic }
  };
  var match = location.pathname.indexOf(BASE_PATH + '/') === 0
    ? /^\/(dishes|shops|topics)\/(\d+)\/?$/.exec(location.pathname.slice(BASE_PATH.length))
    : null;
  /** 唤起 App 的目标路径, 和分享链接一致, 保留 comment 等参数. */
  var targetPath = (function () {
    if (!match) return BASE_PATH + '/';
    var params = new URLSearchParams(location.search);
    var query = params.toString();
    return BASE_PATH + '/' + match[1] + '/' + match[2] + (query ? '?' + query : '');
  })();

  function load() {
    if (!match) { renderIntro(); return; }
    var route = ROUTES[match[1]];
    api(route.api(match[2])).then(function (data) {
      if (!data || typeof data !== 'object') throw new Error('biz');
      route.render(data);
    }).catch(function () {
      renderIntro();
    });
  }

  // ---- 唤起 App ----
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  /** 微信, QQ 的内置浏览器拦截 scheme 和 intent. QQ 浏览器 (MQQBrowser 且无 " QQ/") 是普通浏览器. */
  var inBlockedWebView = /MicroMessenger/i.test(ua) || /\sQQ\/[\d.]+/i.test(ua);
  var openHost = OPEN_HOST || location.host;
  /** 唤起用的 HTTPS 地址, 路径和参数与分享链接一致. */
  var openUrl = 'https://' + openHost + targetPath;
  /** 本页是在 OPEN_HOST 上打开的: 系统没把链接交给 App (没装或域名校验失败), 不再链回 OPEN_HOST. */
  var onOpenHost = !!OPEN_HOST && location.host === OPEN_HOST;

  var toastTimer;
  function toast(message) {
    var node = document.getElementById('toast');
    node.textContent = message;
    node.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.classList.remove('show'); }, 3000);
  }

  /**
   * iOS: 不拦截, 由 <a href> 跳到 OPEN_HOST, 系统按 Universal Links 交给 App; 没装时 Safari 打开 OPEN_HOST 上的本页.
   * Android: 发一个 https 的 intent, 走 App Links 的 intent-filter; 没装时 Chrome 打开 browser_fallback_url, 即本主机名的下载页.
   */
  function openApp(e) {
    if (inBlockedWebView) { e.preventDefault(); showGuide(); return; }
    if (isIOS) return;
    e.preventDefault();
    if (!isAndroid) { toast('请在手机上打开这个链接'); return; }
    var fallback = 'https://' + location.host + DOWNLOAD_PATH;
    location.href = 'intent://' + openHost + targetPath + '#Intent;scheme=https;package=' + ANDROID_PACKAGE +
      ';S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
  }

  var guide = document.getElementById('guide');
  function showGuide() {
    closePanel();
    guide.classList.add('show');
    document.getElementById('guide-close').focus();
  }
  function hideGuide() { guide.classList.remove('show'); }
  document.getElementById('guide-close').addEventListener('click', hideGuide);
  guide.addEventListener('click', function (e) { if (e.target === guide) hideGuide(); });

  /** "下载 App": 跳到同主机名的下载页, 由下载页按平台给地址. */
  function downloadButton(cls) {
    var link = el('a', 'btn ' + cls);
    link.href = DOWNLOAD_PATH;
    link.appendChild(icon('download'));
    link.appendChild(el('span', null, '下载 App'));
    return link;
  }

  (function renderActions() {
    var banner = document.getElementById('banner-action');
    var primary = document.getElementById('primary-action');
    var slot = document.getElementById('download-slot');
    if (onOpenHost) {
      var notice = document.getElementById('notice');
      notice.textContent = '没有找到 App，可以先下载';
      notice.hidden = false;
      banner.replaceWith(downloadButton('btn-solid btn-small'));
      primary.replaceWith(downloadButton('btn-solid btn-primary'));
      slot.remove();
      return;
    }
    [banner, primary].forEach(function (a) {
      a.href = openUrl;
      a.addEventListener('click', openApp);
    });
    slot.appendChild(downloadButton('btn-mist'));
  })();

  // ---- 底部面板: 需要 App 的操作都弹这个 ----
  var panel = document.getElementById('panel');
  var panelReturn = null;
  document.getElementById('panel-close').appendChild(icon('close'));
  function askApp(subtitle) {
    panelReturn = document.activeElement;
    document.getElementById('panel-sub').textContent = subtitle || '';
    var actions = document.getElementById('panel-actions');
    actions.replaceChildren();
    if (onOpenHost) {
      actions.appendChild(downloadButton('btn-solid btn-52'));
    } else {
      var open = el('a', 'btn btn-solid btn-52', '打开 App');
      open.href = openUrl;
      open.addEventListener('click', openApp);
      actions.appendChild(open);
      actions.appendChild(downloadButton('btn-mist btn-48'));
    }
    panel.classList.add('show');
    document.body.classList.add('locked');
    var first = actions.querySelector('a, button');
    (first || document.getElementById('panel-close')).focus();
  }
  function closePanel() {
    if (!panel.classList.contains('show')) return;
    panel.classList.remove('show');
    document.body.classList.remove('locked');
    if (panelReturn && panelReturn.focus) panelReturn.focus();
    panelReturn = null;
  }
  document.getElementById('panel-close').addEventListener('click', closePanel);
  panel.querySelector('[data-close]').addEventListener('click', closePanel);

  /** 分享不需要 App: 有系统分享时调起, 没有时复制链接. */
  function share(title) {
    var url = location.href;
    if (navigator.share) {
      navigator.share({ title: title + ' - ' + APP_NAME, url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast('链接已复制'); }, function () { toast('复制失败，请复制地址栏的链接'); });
      return;
    }
    toast('请复制地址栏的链接');
  }

  // ---- 大图浏览: 左右滑动, 也可以点按钮翻页 ----
  var viewer = document.getElementById('viewer');
  var track = document.getElementById('viewer-track');
  var caption = document.getElementById('viewer-caption');
  var prevBtn = document.getElementById('viewer-prev');
  var nextBtn = document.getElementById('viewer-next');
  var viewerPhotos = [];
  var viewerIndex = 0;
  var viewerReturn = null;
  document.getElementById('viewer-close').appendChild(icon('close'));
  prevBtn.appendChild(icon('chevron-right'));
  nextBtn.appendChild(icon('chevron-right'));
  function viewerUpdate() {
    var p = viewerPhotos[viewerIndex];
    caption.textContent = [(viewerIndex + 1) + ' / ' + viewerPhotos.length, p && p.credit ? p.credit + ' 拍的' : null].filter(Boolean).join('  ');
    prevBtn.disabled = viewerIndex <= 0;
    nextBtn.disabled = viewerIndex >= viewerPhotos.length - 1;
    prevBtn.hidden = nextBtn.hidden = viewerPhotos.length < 2;
  }
  function viewerGo(i) {
    viewerIndex = clamp(i, 0, viewerPhotos.length - 1);
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    track.scrollTo({ left: viewerIndex * track.clientWidth, behavior: reduce ? 'auto' : 'smooth' });
    viewerUpdate();
  }
  function openViewer(photos, index) {
    viewerPhotos = photos.filter(function (p) { return p && p.url; });
    if (!viewerPhotos.length) return;
    viewerReturn = document.activeElement;
    track.replaceChildren();
    viewerPhotos.forEach(function (p, i) {
      var slide = el('div', 'viewer-slide');
      var img = new Image();
      img.alt = '第 ' + (i + 1) + ' 张照片';
      img.decoding = 'async';
      img.onerror = function () { img.remove(); };
      img.src = p.url;
      slide.appendChild(img);
      track.appendChild(slide);
    });
    viewer.classList.add('show');
    document.body.classList.add('locked');
    viewerIndex = clamp(index || 0, 0, viewerPhotos.length - 1);
    track.scrollLeft = viewerIndex * track.clientWidth;
    viewerUpdate();
    document.getElementById('viewer-close').focus();
  }
  function closeViewer() {
    if (!viewer.classList.contains('show')) return;
    viewer.classList.remove('show');
    document.body.classList.remove('locked');
    if (viewerReturn && viewerReturn.focus) viewerReturn.focus();
    viewerReturn = null;
  }
  var scrollTimer;
  track.addEventListener('scroll', function () {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function () {
      var i = Math.round(track.scrollLeft / Math.max(track.clientWidth, 1));
      if (i !== viewerIndex) { viewerIndex = clamp(i, 0, viewerPhotos.length - 1); viewerUpdate(); }
    }, 80);
  });
  prevBtn.addEventListener('click', function () { viewerGo(viewerIndex - 1); });
  nextBtn.addEventListener('click', function () { viewerGo(viewerIndex + 1); });
  document.getElementById('viewer-close').addEventListener('click', closeViewer);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { hideGuide(); closePanel(); closeViewer(); return; }
    if (viewer.classList.contains('show')) {
      if (e.key === 'ArrowLeft') viewerGo(viewerIndex - 1);
      if (e.key === 'ArrowRight') viewerGo(viewerIndex + 1);
    }
  });

  if (inBlockedWebView) showGuide();

  load();
})();
</script>
</body>
</html>
