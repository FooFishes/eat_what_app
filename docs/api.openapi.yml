        需登录并使用 /auth/password/code 获取的绑定手机验证码；已有自选用户名不能通过此接口改名。

        成功后当前设备及其他设备均须重新登录。首次手机号登录后可跳过，稍后在账号与安全中设置。


        仅手机号注册且仍使用系统随机登录名的账号可调用，支持跳过首次引导、稍后设置。username
        为3–10位字母、数字或下划线，区分大小写，与不唯一的昵称 userName 分开。code 来自
        /auth/password/code，绑定当前账号手机。newPassword
        可省略（保留原密码状态），传入时仅允许设置初始密码（6–64位，不能全空白）。用户名和初始密码在同一事务内提交；已占用返回30003，已有自选用户名或试图覆盖既有密码返回40002，未绑定手机返回30011，错误验证码返回30005。成功后
        data.reauthenticationRequired=true，当前设备和其他设备都需要重新登录。查重仅表示本站当前同步状态，不预留用户名；双站离线同时占用仍按既有别名冲突机制处理。
