paths:
  /activity/list:
    get:
      summary: 【可选登录】活动：获取列表
      deprecated: false
      description: >-
        **权限：公开（可选登录：带 token 时返回个人状态）**


        获取已上线的活动列表

        游客可访问


        游客可访问；携带有效 token 时会返回 isLiked、isFavorite、myCustomTags 等个人状态，游客响应不含
        accountId。
      operationId: ActivityController_list_get
      tags:
        - Activity
      parameters: []
      responses:
        '200':
          description: 业务响应；code=0 为成功，非零为业务错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_List_ActivityVOResponse'
          headers: {}
        default:
          description: 错误响应；HTTP 状态码及 code/msg 需要共同判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
      security:
        - SaToken: []
