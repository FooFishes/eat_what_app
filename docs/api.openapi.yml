openapi: 3.1.0
info:
  title: EatWhat 业务服务 API
  description: >-
    业务后端接口，按已发布 JAR 的 Spring 映射、参数注解及模型反射生成，排除中控、内部集群和诊断接口。默认
    servers=/api，路径为后端实际映射，不自动去重 /api。当前会话头是 satoken: Bearer <tokenValue>，以登录返回的
    tokenName 为准。HTTP 200 也可能包含非零业务
    code；角色、同意状态和集群可用性仍由服务端检查。时间输出兼容项目自定义毫秒序列化及默认 ISO 转换器；当前双机授权有效期实测为 ISO 时间。
  version: tencent-captcha-20261024
tags:
  - name: Activity
  - name: FoodTagAdmin
  - name: Admin
  - name: CatalogConflict
  - name: CatalogImport
  - name: ProfileConflict
  - name: Location
  - name: Auth
  - name: AccountConsent
  - name: Callback
  - name: Food
  - name: History
  - name: Hub
  - name: Notification
  - name: Restaurant
  - name: Upload
  - name: User
  - name: AccountPasswordRecovery
