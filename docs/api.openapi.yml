            - coordinates
          description: 餐厅位置的 WGS84 几何坐标；地图展示使用 gcjLng/gcjLat 的 GCJ-02 坐标。
        gcjLng:
          type: number
          description: GCJ-02（火星坐标系）经度，单位为度；地图展示使用此坐标系。
        gcjLat:
          type: number
          description: GCJ-02（火星坐标系）纬度，单位为度；地图展示使用此坐标系。
        hubId:
