openapi: 3.1.0
info:
  title: EatWhat 业务后端 API v2
  description: >-
    单站业务后端（feat/eatwhat-v2）由代码生成的接口文档。

    所有接口返回 HTTP 200 + Result{code,data,msg,timestamp}，code=0 为成功，业务码见
    docs/legacy-api/biz-codes.md。

    公网经 nginx 访问，路径前加 /api。登录后在请求头 satoken 里带 "Bearer <tokenValue>"。

    已登录但没同意当前隐私政策版本时，除标注"同意前可用"的接口外都返回 20009。
