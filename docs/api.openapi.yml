          minLength: 2
          maxLength: 12
          pattern: ^\S(.*\S)?$
        avatar:
          type: string
          maxLength: 255
        gender:
          type: string
          pattern: ^(male|female|other)$
        birthday:
          type: string
          format: date
        signature:
          type: string
          maxLength: 255
        hometownProvinceId:
          type: integer
          minimum: 1
        hometownCityId:
          type: integer
          minimum: 1
    SaveConsentPolicyDTORequest:
      type: object
      properties:
        version:
          type: string
          minLength: 1
          pattern: '[A-Za-z0-9][A-Za-z0-9._-]{0,63}'
          description: 发布的政策版本号；正文范围变化须使用新版本，不能重新启用已使用过的旧版本。
        url:
          type: string
          maxLength: 2048
          minLength: 1
          description: 完整授权说明的 HTTPS URL 或站内绝对路径；接口只保存地址，不上传或抓取正文。
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740990
          description: 管理员读取接口返回的当前 revision；不匹配时拒绝保存，需重新读取。
      required:
        - version
        - url
        - expectedRevision
    UserListItemVOResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 数值业务 ID，用于对应资源的详情、修改等接口。
        userName:
          type: string
          description: 用户的展示昵称，可以重复；不是可修改的登录用户名。
        avatar:
          type: string
          description: 头像读取地址，用于展示。
        role:
          type: string
          description: 账号基础角色：user 普通用户、admin 管理员；身份认证状态由 verified 单独表示。
        email:
          type: string
          description: 账号联系邮箱；与学校认证邮箱 verifiedEmail 分开。
        phone:
          type: string
          description: 账号绑定的手机号；未绑定时可为 null。
        verified:
          type: boolean
          description: 账号是否已完成身份认证。
        method:
          type: string
          description: 身份认证方式：sso 为山东大学统一认证，school_email 为学校邮箱；未认证时可为 null。
        studentId:
          type: string
          description: 统一认证取得的学号；未通过统一认证时可为 null。
        realName:
          type: string
          description: 统一认证取得的真实姓名；未通过统一认证时可为 null。
        verifiedEmail:
          type: string
          description: 通过学校邮箱认证的邮箱地址；未完成该认证时可为 null。
        createdAt:
          type: integer
          format: int64
          description: 创建时间，Unix 毫秒时间戳。
        updatedAt:
          type: integer
          format: int64
          description: 最后更新时间，Unix 毫秒时间戳。
        accountStatus:
          $ref: '#/components/schemas/AccountStatusVOResponse'
          description: 账号封禁状态详情，包含状态、原因和封禁时间。
    AuthReply:
      type: object
      required:
        - code
        - data
        - msg
        - timestamp
      properties:
        code:
          type: integer
          description: 业务状态码：0 为成功，非零为业务错误；需与 HTTP 状态码共同判断。
        data:
          type: object
          properties:
            tokenName:
              type: string
              description: 业务会话令牌的请求头名称，当前为 satoken；后续请求使用服务端返回的名称。
            tokenValue:
              type: string
              description: 业务会话令牌值；当前请求头内容为 Bearer <tokenValue>，只在实际登录成功后保存。
            isLogin:
              type: boolean
              description: 是否已登录；同时检查 code=0 和 tokenName/tokenValue 才能建立业务会话。
            loginId:
              description: 登录账号标识，由 Sa-Token 返回；不要与全局主体 UUID 混淆。
            loginType:
              type: string
              description: Sa-Token 登录体系标识，用于区分会话所属的账号体系。
            tokenTimeout:
              type: integer
              format: int64
