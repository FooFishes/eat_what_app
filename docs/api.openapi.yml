          type: integer
          description: 城市 ID，对应城市字典接口。
        location:
          type: object
          properties:
            type:
              type: string
              const: Point
              description: 几何类型：Point 为点，MultiPolygon 为多面边界。
            coordinates:
              type: array
              items: {}
              description: GeoJSON 形式的 WGS84 坐标，点为 [经度, 纬度]，MultiPolygon 按多边形、环、坐标点逐层嵌套。
