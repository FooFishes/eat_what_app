<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 宽屏发现</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
.btn-press:active{transform:translateY(1px)}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: {{s.stage}}; color: {{s.on}}; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; transition: background-color 500ms ease, color 500ms ease;">

  <div aria-hidden="true" style="position: absolute; left: 776px; top: -404px; width: 1608px; height: 1608px; border-radius: 50%; background: {{s.table}}; transition: background-color 500ms ease;"></div>
  <div aria-hidden="true" style="position: absolute; left: 816px; top: -364px; width: 1528px; height: 1528px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{s.ring}}; transition: border-color 500ms ease;"></div>

  <div aria-hidden="true">
    <sc-for list="{{plates}}" as="p" hint-placeholder-count="5">
      <div style="position: absolute; left: 1360px; top: 180px; width: 440px; height: 440px; transform: {{p.t}}; opacity: {{p.o}}; transition: {{tr}};">
        <div style="position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #FFFFFF; box-shadow: 0 0 0 8px #FFFFFF, 0 22px 40px rgba(0,0,0,0.3);"><img src="{{p.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
      </div>
    </sc-for>
  </div>

  <section aria-label="今天吃什么" aria-live="polite" style="position: absolute; left: 472px; top: 188px; width: 300px; height: 300px; display: flex; flex-direction: column;">
    <h1 style="margin: 0; font-size: 64px; line-height: 68px; font-weight: 900; letter-spacing: -1.5px;"><span style="display: block;">{{s.l1}}</span><span style="display: block;">{{s.l2}}</span></h1>
    <span style="margin-top: 18px; font-size: 17px; line-height: 26px; font-weight: 600;">{{s.shop}}</span>
    <span style="font-size: 15px; line-height: 22px; opacity: 0.85;">{{s.dist}}</span>
    <span style="margin-top: auto; font-family: 'Bricolage Grotesque', sans-serif; font-size: 88px; line-height: 88px; font-weight: 800; letter-spacing: -3px;">¥{{s.price}}</span>
  </section>

  <div aria-hidden="true" style="position: absolute; left: 474px; top: 512px; display: flex; gap: 5px;">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
      <span style="width: {{d.w}}px; height: 5px; border-radius: 3px; background: currentColor; opacity: {{d.o}}; transition: width 300ms ease, opacity 300ms ease;"></span>
    </sc-for>
  </div>

  <div style="position: absolute; left: 472px; top: 540px; display: flex; gap: 10px;">
    <button type="button" class="btn-press" onClick="{{next}}" style="width: 160px; height: 56px; border: 0; border-radius: 28px; background: {{s.ghost}}; color: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -2px 0 rgba(0,0,0,0.1), 0 1px 2px rgba(0,0,0,0.1); transition: background-color 500ms ease, transform 90ms ease;"><dc-import name="G-Icon" icon="shuffle" size="18" hint-size="18px,18px"></dc-import>换一个</button>
    <a href="G-Dish.dc.html" class="btn-press" style="width: 160px; height: 56px; border-radius: 28px; background-color: {{s.on}}; background-image: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(35,28,24,0.07)); box-shadow: {{s.solidShadow}}; color: {{s.stage}}; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: background-color 500ms ease, color 500ms ease, transform 90ms ease;">就它了</a>
  </div>

  <aside aria-label="推荐列表" style="position: absolute; left: 16px; top: 16px; bottom: 16px; width: 400px; box-sizing: border-box; padding: 12px 20px 0; overflow: hidden; background: #FFFFFF; color: #231C18; border-radius: 28px; display: flex; flex-direction: column; gap: 14px;">
    <header style="display: flex; align-items: center; justify-content: space-between; margin-right: -8px;">
      <a href="G-PanelPlace.dc.html" style="height: 44px; color: inherit; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600;">
        <dc-import name="G-Icon" icon="nearby" size="16" hint-size="16px,16px"></dc-import>
        软件园
        <span style="font-weight: 400; color: #6E625B;">晚饭</span>
        <dc-import name="G-Icon" icon="chevronDown" size="14" hint-size="14px,14px"></dc-import>
      </a>
      <div style="display: flex; gap: 4px;">
        <a href="G-Search.dc.html" aria-label="搜索" style="width: 44px; height: 44px; color: inherit; text-decoration: none; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="search" size="22" hint-size="22px,22px"></dc-import></a>
        <a href="G-Inbox.dc.html" aria-label="通知，4 条未读" style="position: relative; width: 44px; height: 44px; color: inherit; text-decoration: none; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="bell" size="22" hint-size="22px,22px"></dc-import><span style="position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 4px; background: #231C18; box-shadow: 0 0 0 2px #FFFFFF;"></span></a>
      </div>
    </header>
    <div role="tablist" aria-label="推荐分类" style="display: flex; gap: 20px; align-items: center; height: 32px; margin-right: -20px; overflow: hidden; white-space: nowrap;">
      <button type="button" role="tab" aria-selected="true" style="flex: none; height: 32px; padding: 0; border: 0; background: none; color: #231C18; font-size: 17px; font-weight: 900;">今日推荐</button>
      <button type="button" role="tab" aria-selected="false" style="flex: none; height: 32px; padding: 0; border: 0; background: none; color: #6E625B; font-size: 15px; display: flex; align-items: center; gap: 4px;"><dc-import name="G-Icon" icon="topic" size="16" hint-size="16px,16px"></dc-import>期末续命餐</button>
      <button type="button" role="tab" aria-selected="false" style="flex: none; height: 32px; padding: 0; border: 0; background: none; color: #6E625B; font-size: 15px;">主食</button>
      <button type="button" role="tab" aria-selected="false" style="flex: none; height: 32px; padding: 0; border: 0; background: none; color: #6E625B; font-size: 15px;">小吃</button>
      <button type="button" role="tab" aria-selected="false" style="flex: none; height: 32px; padding: 0; border: 0; background: none; color: #6E625B; font-size: 15px;">饮品</button>
      <button type="button" role="tab" aria-selected="false" style="flex: none; height: 32px; padding: 0; border: 0; background: none; color: #6E625B; font-size: 15px;">甜品</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 14px; row-gap: 18px;">
      <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
        <img src="../assets/photos/p_tieguo.png" alt="铁锅炖大鹅" style="width: 100%; height: 150px; border-radius: 22px; object-fit: cover; display: block;">
        <div style="display: flex; flex-direction: column;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">铁锅炖大鹅</h3><span style="font-size: 13px; color: #6E625B;">东北饭庄</span></div>
      </a>
      <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
        <img src="../assets/photos/p_niandou.png" alt="粘豆包" style="width: 100%; height: 150px; border-radius: 22px; object-fit: cover; display: block;">
        <div style="display: flex; flex-direction: column;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">粘豆包</h3><span style="font-size: 13px; color: #6E625B;">老街点心</span></div>
      </a>
      <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
        <img src="../assets/photos/p_luosi.png" alt="柳州螺蛳粉" style="width: 100%; height: 150px; border-radius: 22px; object-fit: cover; display: block;">
        <div style="display: flex; flex-direction: column;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">柳州螺蛳粉</h3><span style="font-size: 13px; color: #6E625B;">螺蛳粉研究所</span></div>
      </a>
      <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
        <img src="../assets/photos/sq_paigu.png" alt="玉米排骨汤" style="width: 100%; height: 150px; border-radius: 22px; object-fit: cover; display: block;">
        <div style="display: flex; flex-direction: column;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">玉米排骨汤</h3><span style="font-size: 13px; color: #6E625B;">家常小馆</span></div>
      </a>
      <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
        <img src="../assets/photos/sq_hongshao.png" alt="红烧肉" style="width: 100%; height: 150px; border-radius: 22px; object-fit: cover; display: block;">
        <div style="display: flex; flex-direction: column;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">红烧肉</h3><span style="font-size: 13px; color: #6E625B;">家常小馆</span></div>
      </a>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; bottom: 20px; height: 60px;">
      <dc-import name="G-Nav" active="home" hint-size="100%,60px"></dc-import>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 0 };
  }
  renderVals() {
    const ink = '#231C18';
    const light = { on: ink, ghost: 'rgba(255,255,255,0.42)', table: 'rgba(255,255,255,0.22)', ring: 'rgba(255,255,255,0.55)', solidShadow: 'inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16)' };
    const dark = { on: '#FFFFFF', ghost: 'rgba(255,255,255,0.18)', table: 'rgba(255,255,255,0.07)', ring: 'rgba(255,255,255,0.22)', solidShadow: 'inset 0 -2px 0 rgba(0,0,0,0.16), 0 2px 4px rgba(0,0,0,0.18), 0 8px 18px rgba(0,0,0,0.16)' };
    const dishes = [
      Object.assign({ l1: '柳州', l2: '螺蛳粉', shop: '螺蛳粉研究所', dist: '600 m', price: '16', stage: '#8F5B24', img: '../assets/photos/sq_luosi.png' }, dark),
      Object.assign({ l1: '铁锅炖', l2: '', shop: '东北饭庄', dist: '750 m', price: '58', stage: '#A8321C', img: '../assets/photos/sq_tieguo.png' }, dark),
      Object.assign({ l1: '粘豆包', l2: '', shop: '老街点心', dist: '260 m', price: '8', stage: '#F3C46E', img: '../assets/photos/sq_niandou.png' }, light),
      Object.assign({ l1: '红烧肉', l2: '', shop: '家常小馆', dist: '500 m', price: '38', stage: '#8F5B24', img: '../assets/photos/sq_hongshao.png' }, dark),
      Object.assign({ l1: '玉米', l2: '排骨汤', shop: '家常小馆', dist: '500 m', price: '26', stage: '#D8B27A', img: '../assets/photos/sq_paigu.png' }, light)
    ];
    const N = dishes.length;
    // 转盘中心在画面右侧外面，菜沿着右边缘竖着转：上一道在右下角，下一道在右上角
    const STEP = 50;
    const RADIUS = 560;
    const n = this.state.n;
    const k = ((n % N) + N) % N;
    return {
      s: dishes[k],
      plates: dishes.map((d, i) => {
        let off = (((i - n) % N) + N) % N;
        if (off > N / 2) off -= N;
        const theta = -90 + off * STEP;
        const scale = off === 0 ? 1 : 0.72;
        return {
          img: d.img,
          t: 'rotate(' + theta + 'deg) translateY(-' + RADIUS + 'px) rotate(' + (-theta) + 'deg) scale(' + scale + ')',
          o: Math.abs(off) >= 2 ? 0 : 1
        };
      }),
      dots: dishes.map((_, i) => ({ w: i === k ? 16 : 5, o: i === k ? 1 : 0.4 })),
      tr: 'transform 680ms cubic-bezier(0.2, 0.9, 0.25, 1.1), opacity 280ms ease',
      next: () => this.setState({ n: this.state.n + 1 })
    };
  }
}
</script>
</body>
</html>
