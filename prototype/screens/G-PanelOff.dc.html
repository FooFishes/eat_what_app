<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 功能暂时关了</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
.btn-solid{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none;">
    <dc-import name="G-DishMore" hint-size="390px,844px"></dc-import>
  </div>
  <a href="G-DishMore.dc.html" aria-label="关闭面板" style="position: absolute; inset: 0; background: rgba(35,28,24,0.45);"></a>

  <section role="alertdialog" aria-labelledby="off-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 32px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 14px;">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #E6DED8;"></span>
    <div style="display: flex; align-items: center; gap: 14px; margin-top: 4px;">
      <span aria-hidden="true" style="flex: none; width: 52px; height: 52px; border-radius: 50%; background: #F4EFEB; display: flex; align-items: center; justify-content: center;">
        <sc-if value="{{isOff}}" hint-placeholder-val="{{ true }}"><dc-import name="G-Icon" icon="pause" size="26" hint-size="26px,26px"></dc-import></sc-if>
        <sc-if value="{{isReadonly}}" hint-placeholder-val="{{ false }}"><dc-import name="G-Icon" icon="tool" size="26" hint-size="26px,26px"></dc-import></sc-if>
      </span>
      <h1 id="off-title" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 900;">{{title}}</h1>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 24px; color: #4A3C31;">{{body}}</p>
    <a href="G-DishMore.dc.html" class="btn-solid" style="margin-top: 6px; height: 52px; border-radius: 26px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">知道了</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["功能关了","维护只读"],"default":"功能关了"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const readonly = (this.props.kind ?? '功能关了') === '维护只读';
    return {
      isOff: !readonly,
      isReadonly: readonly,
      title: readonly ? '维护中，暂时不能评论' : '这个功能暂时关了',
      body: readonly
        ? '预计今晚 23:30 恢复。看菜、看店、看评论都不受影响。'
        : '评论在调整，这两天只能看、不能写。其他功能照常用。'
    };
  }
}
</script>
</body>
</html>
