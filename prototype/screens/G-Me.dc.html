<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["上传","收藏","评论"],"default":"上传"},"fav":{"editor":"enum","options":["菜","店"],"default":"菜"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const tabs = { '上传': 'up', '收藏': 'fav', '评论': 'cm' };
    this.state = { tab: tabs[props.tab] || 'up', fav: props.fav === '店' ? 'shop' : 'dish' };
  }
  renderVals() {
    const tab = this.state.tab;
    const mk = (key, label, count, pending) => {
      const on = tab === key;
      return {
        label: label, count: count, hasCount: count !== null, pending: !!pending,
        on: on, fg: on ? '#231C18' : '#6E625B', size: on ? 17 : 15, w: on ? 900 : 400, cw: on ? 800 : 600,
        pick: () => this.setState({ tab: key })
      };
    };
    const seg = (key) => {
      const on = this.state.fav === key;
      return { on: on, bg: on ? '#231C18' : '#F4EFEB', fg: on ? '#FFFFFF' : '#231C18', w: on ? 600 : 400, pick: () => this.setState({ fav: key }) };
    };
    return {
      tabs: [mk('up', '上传', 42), mk('fav', '收藏', 117), mk('cm', '评论', null, true)],
      showUploads: tab === 'up',
      showFav: tab === 'fav',
      showComments: tab === 'cm',
      fDish: seg('dish'),
      fShop: seg('shop')
    };
  }
}
</script>
