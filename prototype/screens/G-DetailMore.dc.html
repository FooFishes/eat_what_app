<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 餐厅详情（往下滑）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 124px; background: #F3C46E;"></div>
  <header style="position: absolute; left: 8px; right: 8px; top: 48px; height: 44px; display: flex; align-items: center; gap: 4px;">
    <a href="G-Detail.dc.html" aria-label="返回" style="flex: none; width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
    <span style="flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 17px; font-weight: 900; white-space: nowrap;">袁记云饺</span>
      <span style="font-size: 13px; font-weight: 600;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;">86%</span> 推荐</span>
    </span>
    <button type="button" aria-label="收藏店铺（待接入）" style="flex: none; width: 44px; height: 44px; border: 0; background: none; color: #231C18; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="bookmark" size="22" hint-size="22px,22px"></dc-import>
    </button>
    <button type="button" aria-label="分享" style="flex: none; width: 44px; height: 44px; border: 0; background: none; color: #231C18; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="share" size="22" hint-size="22px,22px"></dc-import>
    </button>
  </header>

  <div style="position: absolute; left: 0; right: 0; top: 104px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 24px;">

    <section style="display: flex; flex-direction: column; gap: 12px;">
      <h2 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 20px; line-height: 28px; font-weight: 900;">你觉得这家怎么样<span style="font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></h2>
      <div role="radiogroup" aria-label="你觉得这家怎么样" style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{rates}}" as="r" hint-placeholder-count="4">
          <button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: {{r.bg}}; color: {{r.fg}}; font-size: 15px; font-weight: {{r.w}}; transition: background-color 160ms ease, color 160ms ease;">{{r.label}}</button>
        </sc-for>
      </div>
      <span style="font-size: 12px; line-height: 18px; color: #6E625B;">{{rateTip}}</span>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <h2 style="margin: 0; display: flex; align-items: baseline; gap: 6px; font-size: 20px; line-height: 28px; font-weight: 900;">全部菜品<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800;">13</span></h2>
        <span style="font-size: 13px; color: #6E625B;">按赞数</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 14px; row-gap: 18px;">
        <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
          <div style="height: 150px; border-radius: 22px; background: #F8E6C4; overflow: hidden; position: relative;"><img src="../assets/dishes/yuntun.svg" alt="" style="position: absolute; left: 28px; top: 18px; width: 150px; height: 150px;"></div>
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">鲜虾蟹籽云吞</h3><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800;">¥18</span></div>
        </a>
        <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
          <div style="height: 150px; border-radius: 22px; background: #E2EAF3; overflow: hidden; position: relative;"><img src="../assets/dishes/jiaozi.svg" alt="" style="position: absolute; left: -18px; top: 22px; width: 150px; height: 150px;"></div>
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">玉米鲜肉饺子</h3><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800;">¥16</span></div>
        </a>
        <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
          <span aria-hidden="true" style="height: 150px; border-radius: 22px; background: #F4EFEB; display: block;"></span>
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">虾仁小馄饨</h3><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800;">¥15</span></div>
        </a>
        <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
          <span aria-hidden="true" style="height: 150px; border-radius: 22px; background: #F4EFEB; display: block;"></span>
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">香煎锅贴</h3><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800;">¥12</span></div>
        </a>
      </div>
    </section>

    <a href="G-WrongInfo.dc.html" style="align-self: center; height: 44px; padding: 0 12px; color: #6E625B; font-size: 13px; text-decoration: none; display: flex; align-items: center; gap: 4px;"><dc-import name="G-Icon" icon="warning" size="16" hint-size="16px,16px"></dc-import>信息有误</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rate: '推荐' };
  }
  renderVals() {
    const cur = this.state.rate;
    return {
      rates: ['推荐', '还不错', '一般', '不推荐'].map((label) => {
        const on = cur === label;
        return {
          label: label,
          on: on ? 'true' : 'false',
          bg: on ? '#231C18' : '#F4EFEB',
          fg: on ? '#FFFFFF' : '#231C18',
          w: on ? 600 : 400,
          pick: () => this.setState({ rate: on ? '' : label })
        };
      }),
      rateTip: cur ? '你选了「' + cur + '」，再点一次就撤回' : '点一个就提交，以后可以改'
    };
  }
}
</script>
</body>
</html>
