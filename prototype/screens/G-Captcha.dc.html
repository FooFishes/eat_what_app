<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 人机验证</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none;">
    <dc-import name="G-PhoneLogin" hint-size="390px,844px"></dc-import>
  </div>
  <a href="G-PhoneLogin.dc.html" aria-label="关闭面板" style="position: absolute; inset: 0; background: rgba(35,28,24,0.45);"></a>

  <section role="dialog" aria-labelledby="cap-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 32px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 14px;">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #E6DED8;"></span>

    <sc-if value="{{isCheck}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-top: -6px;">
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <h1 id="cap-title" style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 20px; line-height: 28px; font-weight: 900;">先确认一下你不是机器<span style="font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></h1>
          <span style="font-size: 13px; line-height: 20px; color: #6E625B;">这台设备刚才要了好几次验证码，确认完会接着发</span>
        </span>
        <a href="G-PhoneLogin.dc.html" aria-label="关闭" style="flex: none; width: 44px; height: 44px; margin-right: -10px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="close" size="22" hint-size="22px,22px"></dc-import></a>
      </div>
      <div style="height: 168px; box-sizing: border-box; border: 1.5px dashed #9A8B80; border-radius: 22px; background: #F4EFEB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #6E625B; text-align: center;">
        <dc-import name="G-Icon" icon="shield" size="28" hint-size="28px,28px"></dc-import>
        <span style="font-size: 14px; line-height: 20px;">[人机验证组件放这里]<br>用哪一家在依赖选型里定</span>
      </div>
      <span style="font-size: 12px; line-height: 18px; color: #6E625B;">验证不过去的话，换个网络再试，或者用密码登录</span>
    </sc-if>

    <sc-if value="{{isLimit}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 14px; margin-top: 4px;">
        <span aria-hidden="true" style="flex: none; width: 52px; height: 52px; border-radius: 50%; background: #F4EFEB; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="time" size="26" hint-size="26px,26px"></dc-import></span>
        <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 900;">验证码发得太频繁了，明天再试</h1>
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 24px; color: #4A3C31;">同一个号码 1 小时最多发 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;">5</span> 次，一天最多 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;">10</span> 次。设过密码的话，现在就能用密码登录。</p>
      <div style="display: flex; gap: 10px; margin-top: 4px;">
        <a href="G-PasswordLogin.dc.html" class="btn-light" style="flex: 1; height: 52px; border-radius: 26px; background: linear-gradient(180deg, #FBF8F6, #F4EFEB); color: #231C18; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -2px 0 rgba(35,28,24,0.1), 0 1px 2px rgba(35,28,24,0.12), 0 3px 8px rgba(35,28,24,0.06);">用密码登录</a>
        <a href="G-PhoneLogin.dc.html" class="btn-solid" style="flex: 1; height: 52px; border-radius: 26px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">知道了</a>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["人机验证","发太频繁了"],"default":"人机验证"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const limit = (this.props.kind ?? '人机验证') === '发太频繁了';
    return { isLimit: limit, isCheck: !limit };
  }
}
</script>
</body>
</html>
