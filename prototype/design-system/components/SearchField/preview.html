<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SearchField</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); color: var(--ink); }
  .col { display: flex; flex-direction: column; gap: var(--space-16); padding: var(--space-20); max-width: 380px; }
  label { height: 48px; padding: 0 4px 0 16px; box-sizing: border-box; border-radius: var(--radius-pill); display: flex; align-items: center; gap: var(--space-10); }
  .on-paper { background: var(--mist); }
  .map { padding: var(--space-14); border-radius: var(--radius-tile); background: var(--map-ground); }
  .on-map { background: var(--paper); box-shadow: var(--shadow-float); }
  input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 400 15px/22px var(--font-sans); color: var(--ink); }
  input::placeholder { color: var(--ink-muted); }
  .filter { flex: none; width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--mist); color: var(--ink); display: flex; align-items: center; justify-content: center; }
  svg { flex: none; }
</style>
</head>
<body>
<div class="col">
  <label class="on-paper">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4-4"/></svg>
    <input id="search-shop" type="search" placeholder="搜店名" aria-label="搜店名">
  </label>
  <div class="map">
    <label class="on-map">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4-4"/></svg>
      <input id="search-map" type="search" placeholder="搜店名或菜名" aria-label="搜店名或菜名">
      <button type="button" class="filter" aria-label="筛选"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"/><path d="M18 6h2"/><circle cx="16" cy="6" r="2"/><path d="M4 18h4"/><path d="M12 18h8"/><circle cx="10" cy="18" r="2"/></svg></button>
    </label>
  </div>
</div>
</body>
</html>
